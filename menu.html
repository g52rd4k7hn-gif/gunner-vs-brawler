<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>枪手 vs 打手 · 入口</title>
<style>
  :root{ --ink:#2b2926; --paper:#f7f4ee; --line:#d8d2c6; --accent:#c85a3c; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Sans GB","PingFang SC",-apple-system,sans-serif; }
  body{ display:flex; align-items:center; justify-content:center; padding:28px 20px calc(28px + env(safe-area-inset-bottom)); }
  .card{ width:min(560px,100%); }
  h1{ font-size:30px; margin:0 0 6px; letter-spacing:.02em; }
  .sub{ color:#8b857a; font-size:14px; margin:0 0 26px; }
  .play{ display:block; text-align:center; text-decoration:none; color:#fff; background:var(--accent);
    padding:18px; border-radius:14px; font-size:19px; font-weight:700; letter-spacing:.05em;
    box-shadow:0 8px 24px #c85a3c33; transition:transform .12s; }
  .play:active{ transform:scale(.98); }
  .row{ display:flex; gap:18px; align-items:center; margin-top:26px;
        padding-top:24px; border-top:1px solid var(--line); }
  .qr{ width:132px; height:132px; image-rendering:pixelated; border-radius:8px; }
  .meta{ font-size:13px; line-height:1.9; color:#6f6a60; }
  .url{ font-family:Menlo,monospace; font-size:13px; color:var(--ink);
        background:#00000008; padding:3px 7px; border-radius:5px; word-break:break-all; }
  table{ width:100%; margin-top:26px; border-collapse:collapse; font-size:13.5px; }
  td{ padding:7px 0; border-bottom:1px solid var(--line); }
  td:first-child{ width:150px; color:#8b857a; font-family:Menlo,monospace; font-size:12.5px; }
  .note{ margin-top:22px; font-size:12.5px; color:#9a948a; line-height:1.8; }
</style>
</head>
<body>
<div class="card">
  <h1>枪手 vs 打手</h1>
  <p class="sub">火柴人格斗 · 三局两胜</p>

  <a class="play" href="./game_offline.html">开始游戏</a>

  <div style="margin-top:22px">
    <div style="font-size:12px;color:#8b857a;margin-bottom:6px">游戏地址（复制到手机浏览器）</div>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="url" readonly value="https://gunner-vs-brawler.netlify.app/"
             style="flex:1;font-family:Menlo,monospace;font-size:13px;padding:12px;
                    border:1px solid #d8d2c6;border-radius:8px;background:#fff;color:#2b2926">
      <button id="copy" style="padding:12px 16px;border-radius:8px;border:0;background:#c85a3c;
              color:#fff;font-size:13px;font-weight:700">复制</button>
    </div>
    <div style="font-size:12px;color:#9a948a;margin-top:8px">电脑关机也能玩 · 首次加载约 14MB，之后有缓存</div>
  </div>

  <table>
    <tr><td>A / D</td><td>左右移动（Shift 跑）</td></tr>
    <tr><td>W / 空格</td><td>跳（空中再按一次二段跳）</td></tr>
    <tr><td>J</td><td>横扫</td></tr>
    <tr><td>Shift + J</td><td>重击（按住 0.35 秒蓄满，22 伤）</td></tr>
    <tr><td>K</td><td>闪避</td></tr>
    <tr><td>L</td><td>拨挡（反弹子弹）</td></tr>
    <tr><td>Tab</td><td>镜头：锁主角 / 全景</td></tr>
    <tr><td>F1 · F2 · F3</td><td>判定框 · 枪口模式 · 自检面板</td></tr>
  </table>

  <p class="note">
    手机端会自动出现虚拟按键（左下移动，右下跳/打/重/闪/挡），横屏游玩效果最好。<br>
    第一次点一下画面才会出声（浏览器自动播放限制）。
  </p>
</div>
<script>
document.getElementById('copy')?.addEventListener('click', async () => {
  const i = document.getElementById('url');
  i.select(); i.setSelectionRange(0, 9999);
  try { await navigator.clipboard.writeText(i.value); } catch(e) { document.execCommand('copy'); }
  const b = document.getElementById('copy'); b.textContent = '已复制'; setTimeout(()=>b.textContent='复制', 1200);
});
</script>
</body>
</html>
