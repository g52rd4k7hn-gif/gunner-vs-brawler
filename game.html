<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>枪手 vs 木易 — 火柴人格斗</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    font-family:"Hiragino Sans GB","PingFang SC",sans-serif;}
  #wrap{position:relative;width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{background:#faf9f5;max-width:100%;max-height:100%;box-shadow:0 20px 60px #000a;border-radius:6px}
  #hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(95%,1240px);
    display:flex;gap:12px;align-items:flex-start;color:#eee;font-size:13px;pointer-events:none}
  #hud .side{flex:1;display:flex;flex-direction:column;gap:4px}
  #hud .cools{display:flex;flex-direction:column;gap:3px}
  #hud .cool{display:flex;flex-direction:column;gap:2px;font-size:9.5px;color:#ffffffd0;letter-spacing:.02em}
  #hud .cool .lab{line-height:1.35;color:#fff;background:rgba(0,0,0,.5);display:inline-block;
    padding:1px 6px;border-radius:4px;font-size:9.5px;text-shadow:0 1px 2px #000a}
  #hud .side.right .cool .lab{text-align:right;align-self:flex-end}
  #hud .cool .trk{width:100%;height:9px;border-radius:5px;background:#ffffff26;overflow:hidden;
    box-shadow:inset 0 0 0 1px #ffffff1a}
  #hud .cool .trk i{display:block;height:100%;width:0%;background:#8ee0a0;transition:width .08s linear}
  #hud .cool.ready .trk i{background:#6fd0ff}
  #hud .cool.charge .trk i{background:#ff5a46}
  .bar{flex:1;height:16px;background:#0006;border:1px solid #0006;border-radius:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e05a4a,#f0a35e);transition:width .1s}
  .bar.right i{background:linear-gradient(90deg,#5ea8f0,#8ee0a0);float:right}
  #touch{position:absolute;inset:0;pointer-events:none;display:none;overflow:hidden}
  #touch.on{display:block}
  #touch .pad{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto}
  #touch .pad.left{left:calc(16px + env(safe-area-inset-left))}
  #touch .pad.right{
    right:calc(12px + env(safe-area-inset-right));
    bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:none;z-index:3;
  }
  #touch button{
    width:58px;height:58px;border-radius:50%;border:2px solid #ffffff33;
    background:#00000055;color:#f2efe8;font-size:17px;font-family:inherit;
    -webkit-tap-highlight-color:transparent;backdrop-filter:blur(4px);touch-action:none;
  }
  #touch button:active{background:#ffffff33;transform:scale(.94)}
  #touch .stick{
    position:absolute;left:calc(12px + env(safe-area-inset-left));
    bottom:calc(76px + env(safe-area-inset-bottom));
    width:116px;height:116px;pointer-events:auto;touch-action:none;z-index:2;
  }
  #touch .stick .ring{
    position:absolute;inset:0;border-radius:50%;
    border:2px solid #ffffff2e;background:radial-gradient(circle,#0000003d,#0000001a 70%);
    backdrop-filter:blur(3px);
  }
  #touch .stick .knob{
    position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:#ffffff2b;border:2px solid #ffffff59;
    transition:transform .04s linear;
  }
  #touch .stick .knob.on{background:#ffffff4d}
  #touch .stick .hint{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-15px;white-space:nowrap;
    font-size:9px;color:#ffffff7a;letter-spacing:.02em;
  }
  @media (max-width:820px){
    #hud{top:4px;font-size:11px}
    .bar{height:12px}
    #hud .cool .trk{height:8px}
    #tip{display:block;font-size:10px;bottom:4px;opacity:.8;padding:0 8px;text-align:center;line-height:1.4}
    #msg{font-size:40px}
  }
  #rotate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:#111c;color:#f2efe8;font-size:18px;text-align:center;line-height:1.8;pointer-events:none}
  @media (orientation:portrait) and (max-width:820px){ #rotate{display:flex} }
  #tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#8b8880;font-size:12px;pointer-events:none}
  #start{position:absolute;inset:0;background:#0f0f12f2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;z-index:20;color:#f2efe8;padding:20px;text-align:center}
  #start h1{margin:0;font-size:34px;letter-spacing:.06em}
  #start p{margin:0;color:#a9a49a;font-size:13px}
  #start .opts{display:flex;flex-direction:column;gap:12px;width:min(520px,92vw);margin-top:8px}
  #start button{display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:12px;
    border:1px solid #ffffff26;background:#ffffff10;color:#f2efe8;font-family:inherit;font-size:16px;text-align:left}
  #start button b{font-size:18px}
  #start button span{font-size:12px;color:#a9a49a;line-height:1.5}
  #start button:hover{background:#ffffff1f;border-color:#ffffff45}
  #start button:active{transform:scale(.99)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#2b2926;font-size:64px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s}
  #loadbar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:360px;height:8px;
    background:#0002;border-radius:4px;overflow:hidden}
  #loadbar i{display:block;height:100%;width:0;background:#2b2926;transition:width .1s}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="hud">
    <div class="side">
      <div class="bar"><i id="hp1"></i></div>
      <div class="cools" id="cool1"></div>
    </div>
    <div style="min-width:132px;text-align:center;opacity:.85"><span id="score">0 : 0</span><br><span style="font-size:11px;opacity:.7">三局两胜</span></div>
    <div class="side right">
      <div class="bar right"><i id="hp2"></i></div>
      <div class="cools" id="cool2"></div>
    </div>
  </div>
  <div id="start">
    <h1>枪手 vs 木易</h1>
    <p>火柴人格斗 · 三局两胜 · 选择难度开始</p>
    <div class="opts">
      <button data-d="normal"><b>普通</b><span>无技能 · 最初数值（血量 500）</span></button>
      <button data-d="divine"><b>一丝神力</b><span>完整技能 · 当前数值</span></button>
      <button id="roleBtn" type="button"><b>扮演：木易</b><span>点一下切换成「扮演枪手」</span></button>
      <button data-d="insane"><b>不可思议</b><span>狂化无冷却 · 每枪蓄能 · 2.5s 装弹<br>击飞 ×15 · 4 倍速不可反弹</span></button>
    </div>
  </div>
  <div id="msg"></div>
  <div id="loadbar"><i id="load"></i></div>
  <div id="rotate">请横屏游玩<br><span style="font-size:13px;opacity:.65">横过来画面更大、按键更好按</span></div>
  <div id="touch">
    <div class="stick" id="stick">
      <div class="ring"></div>
      <div class="knob" id="knob"></div>
      <div class="hint">↑ 跳 · ↓ 滑铲 · ←→ 移动</div>
    </div>
    <div class="pad right">
      <button data-k="l">挡</button>
      <button data-k="leap" class="gunonly">后跳</button>
      <button data-k="frenzy" class="gunonly">狂</button>
      <button data-k="heavy">重</button>
      <button data-k="j">打</button>
    </div>
  </div>
  <button id="fs" style="position:absolute;right:10px;top:8px;z-index:9;display:none;
    padding:6px 10px;border-radius:8px;border:1px solid #ffffff2e;background:#00000059;
    color:#fff;font-size:12px;font-family:inherit">⛶</button>
  <div id="tip">A/D 移动 · Shift 跑 · W 跳（可二段） · J 挥击（Shift+J 重击） · K 闪避 · L 拨挡（反弹子弹） · F1 调试</div>
</div>
<script src="atlas.js"></script>
<script>
const SPRITES = {
  "bat_idle": {n: 29, loop: true},
  "bat_shoulder_drop": {n: 19, loop: false},
  "bat_walk": {n: 24, loop: true},
  "bat_run": {n: 19, loop: true},
  "bat_swing_h": {n: 17, loop: false},
  "bat_swing_v": {n: 17, loop: false},
  "bat_swing_low": {n: 17, loop: false},
  "bat_uppercut": {n: 17, loop: false},
  "bat_dodge_l": {n: 17, loop: false},
  "bat_dodge_r": {n: 17, loop: false},
  "bat_jump": {n: 15, loop: false},
  "bat_leap_back": {n: 22, loop: false},
  "bat_pull": {n: 17, loop: false},
  "bat_slide": {n: 17, loop: false},
  "bat_dive": {n: 19, loop: false},
  "bat_getup": {n: 19, loop: false},
  "bat_stagger": {n: 17, loop: false},
  "bat_kneel": {n: 24, loop: false},
  "bat_taunt": {n: 22, loop: false},
  "bat_parry": {n: 14, loop: false},
  "gun_idle": {n: 29, loop: true},
  "gun_raise": {n: 19, loop: false},
  "gun_aim_am55": {n: 24, loop: true}, "gun_fire_am55": {n: 11, loop: false},
  "gun_aim_am25": {n: 24, loop: true}, "gun_fire_am25": {n: 11, loop: false},
  "gun_aim_ap0": {n: 24, loop: true}, "gun_fire_ap0": {n: 11, loop: false},
  "gun_aim_ap18": {n: 24, loop: true}, "gun_fire_ap18": {n: 11, loop: false},
  "gun_aim_up": {n: 29, loop: true},
  "gun_aim_b": {n: 29, loop: true},
  "gun_fire_b": {n: 11, loop: false},
  "gun_aim_up_b": {n: 29, loop: true},
  "gun_fire_up_b": {n: 11, loop: false},
  "gun_fire_up": {n: 11, loop: false},
  "gun_aim": {n: 43, loop: true},
  "gun_fire": {n: 11, loop: false},
  "gun_reload": {n: 38, loop: false},
  "gun_backstep": {n: 22, loop: true},
  "gun_dodge_l": {n: 17, loop: false},
  "gun_dodge_r": {n: 17, loop: false},
  "gun_dodge_side": {n: 17, loop: false},
  "gun_dodge_back": {n: 17, loop: false},
  "gun_block": {n: 29, loop: false},
  "gun_butt": {n: 19, loop: false},
  "gun_hop": {n: 19, loop: false},
  "gun_walk": {n: 24, loop: true},
  "gun_slide": {n: 17, loop: false},
  "gun_jump": {n: 22, loop: false},
  "gun_run": {n: 17, loop: true},
  "gun_leap_back": {n: 22, loop: false},
  "gun_kneel_reload": {n: 38, loop: false},
  "gun_hit": {n: 17, loop: false},
  "gun_lower": {n: 22, loop: false},
  "gun_club_h": {n: 17, loop: false},
  "gun_club_v": {n: 17, loop: false},
  "gun_club_low": {n: 17, loop: false},
  "gun_club_upper": {n: 17, loop: false}
};

window.onerror = (m, src, ln) => { document.title = 'ERR ' + m + ' @' + ln; };

let MAX_HP = 4000;            // 双方血量（随难度变化）

// ── 难度 ──
const DIFFS = {
  normal: {                       // 普通：去掉技能，数值回到最初版本
    label: '普通', desc: '无技能 · 最初数值',
    hp: 500, swing: 8, heavy: 14, ranged: 9, melee: 7, slideDodge: true,
    skills: false, frenzyCd: 30, reload: 1.5, knockbackX: 1,
    alwaysCharged: false, chargeSpeedX: 3, homing: 0, reflectable: true,
  },
  divine: {                       // 一丝神力：当前版本
    label: '一丝神力', desc: '完整技能 · 当前数值',
    hp: 4000, swing: 100, heavy: 200, ranged: 150, melee: 75, slideDodge: false,
    skills: true, frenzyCd: 30, reload: 1.5, knockbackX: 1, brawlerSkillsWeak: true,
    alwaysCharged: false, chargeSpeedX: 3, homing: 0, reflectable: true,
  },
  insane: {                       // 不可思议
    brawlerSkills: true,          // 打手（作为 Boss 时）拥有 全力 / 最后的反击
    label: '不可思议', desc: '狂化无冷却 · 每枪蓄能 · 2.5 秒装弹 · 击飞 ×15 · 4 倍速不可反弹',
    hp: 4000, swing: 100, heavy: 200, ranged: 150, melee: 75, slideDodge: false,
    skills: true, frenzyCd: 0, reload: 2.5, knockbackX: 15,
    alwaysCharged: true, chargeSpeedX: 4, homing: 0, reflectable: false, brawlerSkills: true,
  },
};
let CFG = DIFFS.divine;
let gameStarted = false;
let playerSide = 'brawler';     // 'brawler' | 'gunner'
const CW = 1280, CH = 720, GROUND = 640, FPS = 24;
const WORLD = CW * 20;                 // 地图放大 20 倍
const GRAV = 2300, JUMP_V = 990;       // 跳起约 212px（原来的一半）
const DPR = Math.min(2, window.devicePixelRatio || 1);
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
const imgCache = {};
let musketImg = new Image();
const ACT = Object.keys(SPRITES);
const DMG = {
  brawlerSwing: 100,   // 打手横扫
  brawlerHeavy: 200,   // 打手重击（固定 200）
  chargeBonus: 8,      // 蓄满额外
  gunRanged: 150,      // 枪手远程攻击（固定 150）
  gunChargeBase: 9,    // 蓄能弹基础伤害（9 × 3^n）
  gunMelee: 75,        // 枪手·近战枪托
  reflect: 14,         // 反弹子弹
};
const BODY_H = 236;            // 屏幕上人物实际高度
const LEAP_DIST = 500 + BODY_H;   // 后跳水平距离 = 原来的 500 + 一个身位 ≈ 736
const LEAP_APEX = Math.round(2 * BODY_H);   // 后跳最高点 = 2 个身高 ≈ 472px
const LEAP_RANGE = Math.round(BODY_H * 1.0);   // 贴身后跳的判定范围 ≈ 236px（一个身高）            // 屏幕上人物实际高度：clip 265→645 = 380px × 0.62
const CHEST = 184;             // 胸口离地高度：clip 349 → (645-349)×0.62
const MUZZLE_CLIP = {x: 410, y: 384};
const MUZZLE_UP = {x: 484, y: 77};

const EMB = window.__EMBED || null;
function framePath(a,i){ return EMB ? EMB[a + ':' + i] : `actions/${a}/${String(i).padStart(4,'0')}.png`; }

const ESSENTIAL = [
  'bat_idle','bat_walk','bat_run','bat_jump','bat_swing_h','bat_swing_v','bat_hit','bat_kneel','bat_dodge','bat_parry',
  'gun_idle','gun_backstep','gun_hit','gun_kneel_reload','gun_block','gun_club_h','gun_club_v',
  'gun_aim_ap0','gun_fire_ap0','gun_aim_am25','gun_fire_am25','gun_aim_am55','gun_fire_am55',
];
function preload(done){
  const ATLAS = window.__ATLAS || null;
  const jobs = [];
  if (ATLAS){
    // 图集模式：一个动作一张图，53 个请求搞定
    const srcOf = a => (window.__ATLAS_SRC && window.__ATLAS_SRC[a]) || `atlases/${a}.webp`;
    for (const a of ESSENTIAL) if (ATLAS[a]) jobs.push(['A:' + a, srcOf(a)]);
    for (const a of ACT) if (ATLAS[a] && !ESSENTIAL.includes(a)) jobs.push(['A:' + a, srcOf(a)]);
  } else {
    const ordered = [];
    for (const a of ESSENTIAL) if (SPRITES[a]) for (let i = 0; i < SPRITES[a].n; i++) ordered.push([a + ':' + i, framePath(a, i)]);
    for (const a of ACT) if (!ESSENTIAL.includes(a)) for (let i = 0; i < SPRITES[a].n; i++) ordered.push([a + ':' + i, framePath(a, i)]);
    jobs.push(...ordered);
  }
  jobs.push(['musket', window.__MUSKET || 'musket.png']);
  const essentialN = ATLAS
    ? ESSENTIAL.filter(a => ATLAS[a]).length + 1
    : jobs.filter(([k]) => ESSENTIAL.includes(k.split(':')[0]) || k.startsWith('A:')).length;
  let n = 0; const total = jobs.length, bar = document.getElementById('load');
  let started = false;
  const tick = ()=>{
    n++;
    const pct = n >= essentialN ? (n/total*100) : (n/essentialN*100*0.9);
    if (bar) bar.style.width = Math.min(100, pct).toFixed(1) + '%';
    if (!started && n >= essentialN){ started = true; done(); }
    if (n >= total && !started){ started = true; done(); }
  };
  window.__errs = 0;
  for (const [k, src] of jobs){
    const im = new Image();
    im.onload = tick;
    im.onerror = ()=>{ window.__errs++; tick(); };
    im.src = src; imgCache[k] = im;
    if (k === 'musket') musketImg = im;
  }
  // 真正失败（连续 404/解码失败）才切备用版；单纯“慢”不切
  setTimeout(()=>{
    if (ATLAS && window.__errs >= 3){
      document.title = '图集加载失败，切换备用版本…';
      location.replace('game_offline.html');
      return;
    }
    if (!window.__started) done();
  }, 20000);
}
const DIAG = new URLSearchParams(location.search).get('diag') === '1';
window.__diag = {calls: 0, nulls: 0, atlases: 0, sample: ''};
function getFrame(a, i){
  if (DIAG){
    window.__diag.calls++;
    const A0 = window.__ATLAS && window.__ATLAS[a];
    if (A0 && imgCache['A:' + a] && imgCache['A:' + a].naturalWidth) window.__diag.atlases++;
  }
  const ATLAS = window.__ATLAS;
  if (ATLAS && ATLAS[a]){
    const A = ATLAS[a], img = imgCache['A:' + a];
    if (!img || !img.naturalWidth){ if (DIAG) window.__diag.nulls++; return null; }
    const k = Math.min(i, A.n - 1);
    return {img, sx: (k % A.cols) * A.fw, sy: ((k / A.cols) | 0) * A.fh, sw: A.fw, sh: A.fh};
  }
  const im = imgCache[a + ':' + i] || imgCache[a + ':0'];
  if (DIAG && (!im || !im.naturalWidth)) window.__diag.nulls++;
  return (im && im.naturalWidth) ? {img: im, sx: 0, sy: 0, sw: 1280, sh: 720} : null;
}

// ── 地形：可以站上去、也会挡住子弹 ──
const PLATFORMS = [];
for (let i = 0; i < 26; i++){
  PLATFORMS.push({x: 500 + i * (WORLD - 1000) / 26 + (i%2)*140,
                  y: 230 + (i%3)*80, w: 220 + (i%2)*90, h: 26});
}
// ── 小物件：被挥击打飞 ──
const PROPS = [];
for (let i = 0; i < 90; i++){
  PROPS.push({x: 500 + i * (WORLD - 1000) / 90, y: 0, vx: 0, vy: 0, rot: Math.random()*6,
              spin: 0, alive: true, kind: i % 3, sz: 10 + (i % 3) * 5, hitCd: 0});
}

class Fighter{
  constructor(o){
    Object.assign(this, o);
    this.maxHp = MAX_HP; this.hp = MAX_HP; this.state = 'idle'; this.frame = 0; this.t = 0;
    this.y = 0; this.vy = 0; this.jumps = 0; this.stun = 0; this.invuln = 0;
    this.hitDone = false; this.bulletDone = false; this.reloading = 0; this.closeT = 0;
    this.slideT = 0; this.slideVx = 0;
    this.dmgMult = 1; this.frenzy = false; this.frenzyCd = 0; this.frenzyLeft = 0;
    this.reviving = 0; this.immortalCd = 0; this.reviveFull = false;
    this.frenzyStacks = 0; this.frenzyCount = 0; this.pierceShot = false; this.pierceDmg = 0; this.chargeWarn = 0;
    this.knockT = 0; this.knockDir = 1; this.knockX0 = 0; this.knockDist = 0;
    this.shield = 0; this.shieldMax = 0; this.shieldGuardUsable = true;
    this.forceCd = 0; this.pullT = 0; this.lastStand = false; this.lastStandT = 0;
    this.storedDmg = 0; this.takenTotal = 0; this.counterCd = 0;
  }
  get act(){ return this.acts[this.state] || this.acts.idle; }
  set(s, o = {}){
    if (this.state === s && !o.force) return;
    this.state = s; this.frame = 0; this.t = 0; this.hitDone = false;
  }
  update(dt){
    const rate = (this.state === 'swing') ? 1.7 : 1;   // 普攻播放加快
    this.t += dt * rate;
    const sp = SPRITES[this.act];
    this.frame = sp.loop ? Math.floor(this.t*FPS) % sp.n : Math.min(sp.n-1, Math.floor(this.t*FPS));
    if (this.stun > 0) this.stun -= dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;
  }
  done(){ return this.t >= SPRITES[this.act].n / FPS; }
  hurt(dmg, dir){ applyDamage(this, dmg, dir); }
}

// 统一的伤害结算：打手「承受」、枪手「狂化吸血」、双方血量/硬直
function applyDamage(t, dmg, dir){
  let real = dmg, log = '';
  if (t === p1 && CFG.skills){                     // 打手·承受：掷骰子（普通难度关闭）
    if (Math.random() < SK.endureEven){            // 偶数：本次免伤，回一半血，并按原始伤害存池
      real = 0;
      const heal = dmg * 0.5;
      p1.hp = Math.min(p1.maxHp, p1.hp + heal);
      p1.takenTotal = Math.min(counterCap(), p1.takenTotal + dmg);
      log = '偶数 · 免疫 + 回血 + 存池';
      floatText(t.x, GROUND - BODY_H - 20, `免疫 +${Math.round(heal)} · 存 ${Math.round(dmg)}`, '#2fa85a');
    } else {                                       // 奇数：正常吃满伤害，双倍原始伤害存池
      real = dmg;
      p1.takenTotal = Math.min(counterCap(), p1.takenTotal + dmg * 2);
      log = '奇数 · 满伤 + 双倍存池';
      floatText(t.x, GROUND - BODY_H - 20, `奇数 · 存 ${Math.round(dmg * 2)}`, '#c0392b');
    }
  }
  if (t === p2 && p2.frenzy) real *= 1;            // 狂化不加受伤
  if (t.shield > 0 && real > 0){                    // 护盾先抗
    let absorbed = Math.min(t.shield, real);
    // 护盾保底：盾 > 2000 时，这一击最多打到剩 1000（清零前只触发一次）
    if (t.shieldGuardUsable && t.shield > 2000 && absorbed > t.shield - 1000){
      absorbed = t.shield - 1000;
      t.shieldGuardUsable = false;                  // 用掉了，等盾清零再恢复
    }
    t.shield -= absorbed; real -= absorbed;
    if (t.shield <= 0) t.shieldGuardUsable = true;   // 盾清零 → 保底重新可用
  }
  t.hp = Math.max(0, t.hp - real);
  if (real > 0) floatText(t.x, GROUND - BODY_H * 0.75 - (t.y||0), '-' + Math.round(real), '#2b2926');
  if (window.__lastHit) window.__lastHit.log = log;
  t.stun = 0.18; t.invuln = 0.12; t.hurtT = 0.12;
  if (t.leapT > 0){ t.leapT = 0; t.y = 0; t.leapShot = false; }
  if (t === p2 && (t.state === 'aim' || t.state === 'aimUp')) t.wetShot = true;
  t.set(t.hp <= 0 ? 'ko' : 'hit', {force:true});
  if (t.hp <= 0) onDown(t);
}

function counterCap(){ return SK.counterBaseCap + Math.max(0, p2.shield || 0); }

// 还击对护盾：护盾按比例吃伤害（盾越多挡得越多）
function applyCounterDamage(t, amount, dir){
  if (t.shield > 0){
    const factor = Math.min(1, t.shield / 1000);
    let toShield = Math.min(t.shield, amount * factor);
    if (t.shieldGuardUsable && t.shield > 2000 && toShield > t.shield - 1000){
      toShield = t.shield - 1000;
      t.shieldGuardUsable = false;
    }
    t.shield -= toShield;
    if (t.shield <= 0) t.shieldGuardUsable = true;
    amount -= toShield;
  }
  if (amount > 0) t.hurt(amount, dir);
}

// 谁倒下了
function onDown(t){
  if (CFG.brawlerSkills && t === p1 && !t.lastStand){        // 打手·最后的反击
    t.lastStand = true; t.lastStandT = 30; t.hp = Math.max(1, t.hp);
    t.downed = false;                                       // 不倒：继续行动，不是倒地
    t.takenTotal = Math.max(t.takenTotal, 2000);
    showSkill('最后的反击！', '30 秒不倒 · 反击池保底 2000', '#ff7a1a');
    flash = Math.max(flash, .5); shake = Math.max(shake, 26);
    return;
  }
  if (CFG.skills && t === p2 && p2.immortalCd <= 0 && p2.reviving <= 0){   // 枪手·不朽（冷却好了就能再触发）
    p2.reviving = SK.reviveTime;
    p2.immortalCd = SK.immortalCd;
    p2.reviveFull = Math.random() < SK.immortalChance;
    p2.hp = 0;
    p2.set('ko', {force:true});

}

const isTouch = ('ontouchstart' in window) || Math.min(innerWidth, innerHeight) < 700;
(function setupTouch(){
  const pad = document.getElementById('touch');
  if (!pad) return;
  if (isTouch) pad.classList.add('on');
  if (playerSide !== 'gunner') pad.querySelectorAll('.gunonly').forEach(b=> b.style.display = 'none');
  const hold = (btn, on, off)=>{
    const down = e=>{ e.preventDefault(); audioInit(); on(); };
    const up   = e=>{ e.preventDefault(); off && off(); };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  };
  // ── 虚拟摇杆 ──
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  if (stick && knob){
    let active = false, pid = null, sector = '';
    const R = ()=> stick.clientWidth * 0.36;   // 摇杆最大位移（按尺寸自适应）
    const setKnob = (dx, dy)=>{
      const len = Math.hypot(dx, dy), RL = R();
      const k = len > RL ? RL / len : 1;
      knob.style.transform = `translate(${dx*k}px, ${dy*k}px)`;
    };
    const reset = ()=>{
      active = false; pid = null; sector = '';
      knob.style.transform = 'translate(0,0)'; knob.classList.remove('on');
      keys['a'] = keys['d'] = false; keys['shift'] = false;
    };
    const handle = (e)=>{
      const r = stick.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width/2);
      let dy = e.clientY - (r.top + r.height/2);
      setKnob(dx, dy);
      const len = Math.hypot(dx, dy), RL = R();
      const nx = len > 0 ? dx / len : 0, ny = len > 0 ? dy / len : 0;
      const mag = Math.min(1, len / RL);
      if (mag < 0.28){ keys['a'] = keys['d'] = false; sector = ''; return; }   // 死区

      // 左右移动（只在水平分量足够时）
      keys['a'] = nx < -0.35;
      keys['d'] = nx >  0.35;
      keys['shift'] = mag > 0.82;            // 推到外圈 = 疾跑

      let now = 'mid';
      if (ny < -0.55) now = 'up';           // ↑ 跳
      else if (ny > 0.55) now = 'down';     // ↓ 滑铲

      if (now !== sector){
        sector = now;
        if (now === 'up') jumpReq = true;                        // 上 / 左上 / 右上 → 跳（同时保留左右移动）
        if (now === 'down'){
          if (['idle','walk','run'].includes(p1.state)){
            if (Math.abs(nx) > 0.35) p1.face = nx < 0 ? -1 : 1;  // 左下/右下 → 朝对应方向滑铲
            p1.set('dodge', {force:true});
            p1.slideT = DODGE_TIME;
            p1.slideVx = p1.face * (2 * DODGE_DIST / DODGE_TIME);
            p1.invuln = DODGE_INVULN;
            sfx('land');
          }
        }
      }
    };
    stick.addEventListener('pointerdown', e=>{
      e.preventDefault(); audioInit(); active = true; pid = e.pointerId;
      knob.classList.add('on');
      try { stick.setPointerCapture(pid); } catch(err){}
      handle(e);
    });
    stick.addEventListener('pointermove', e=>{
      if (!active || e.pointerId !== pid) return;
      e.preventDefault(); handle(e);
    });
    const up = e=>{ if (active && (pid === null || e.pointerId === pid)){ e.preventDefault(); reset(); } };
    stick.addEventListener('pointerup', up);
    stick.addEventListener('pointercancel', up);
    stick.addEventListener('pointerleave', e=>{ if (active && e.buttons === 0) up(e); });
  }

  pad.querySelectorAll('button').forEach(btn=>{
    const k = btn.dataset.k;
    if (k === 'a' || k === 'd'){
      hold(btn, ()=> keys[k] = true, ()=> keys[k] = false);
    } else if (k === 'jump'){
      hold(btn, ()=>{ jumpReq = true; }, null);
    } else if (k === 'l'){
      hold(btn, ()=>{ parryReq = true; }, null);
    } else if (k === 'k'){
      hold(btn, ()=>{ if (['idle','walk','run'].includes(p1.state)) p1.set('dodge',{force:true}); }, null);
    } else if (k === 'j'){
      hold(btn, ()=>{ if (['idle','walk','run'].includes(p1.state)) p1.set('swing',{force:true}); }, null);
    } else if (k === 'leap'){
      hold(btn, ()=>{ keyReq.q = true; }, null);
    } else if (k === 'frenzy'){
      hold(btn, ()=>{ keyReq.e = true; }, null);
    } else if (k === 'heavy'){
      hold(btn, ()=>{
        if (!['idle','walk','run'].includes(p1.state)) return;
        p1.chargeT = (p1.chargeT || 0) + 0.36;          // 直接给满蓄力
        if (!p1.chargeSfx){ p1.chargeSfx = true; sfx('charge'); }
      }, ()=>{
        if ((p1.chargeT || 0) > 0){
          p1.set('swing2', {force:true}); p1.charged = true; sfx('heavy');
          p1.chargeT = 0; p1.chargeSfx = false;
        }
      });
    }
  });
})();

}

// ── 音效 / 音乐（WebAudio，全部合成，不依赖音频文件）──
let AC = null, masterGain = null, musicGain = null, audioPlays = 0, musicOn = true, musicTimer = null;
let bgmEl = null, bgmReady = false;

// 外部 BGM：默认读 bgm.mp3，也可以用 ?bgm=你的地址 指定
function tryExternalBgm(){
  const q = new URLSearchParams(location.search).get('bgm');
  const cands = q ? [q] : (window.__BGM ? [window.__BGM] : ['bgm.mp3', 'bgm.m4a', 'bgm.ogg']);
  let idx = 0;
  const a = new Audio();
  a.loop = true; a.volume = 0.55; a.preload = 'auto';
  const next = ()=>{ idx++; if (idx < cands.length) a.src = cands[idx]; };
  const markReady = ()=>{ bgmReady = true; if (musicTimer){ clearInterval(musicTimer); musicTimer = null; } };
  a.addEventListener('canplay', markReady);
  a.addEventListener('canplaythrough', markReady);
  a.addEventListener('loadeddata', ()=>{ if (bgmEl && bgmEl.currentTime >= 0 && !bgmReady) markReady(); });
  a.onerror = ()=>{ bgmReady = false; next(); };
  a.src = cands[0];
  bgmEl = a;
  return a;
}

function _oldTryExternalBgm(){
  const q = new URLSearchParams(location.search).get('bgm');
  const src = q || 'bgm.mp3';
  const a = new Audio();
  a.loop = true; a.volume = 0.55; a.preload = 'auto';
  a.oncanplaythrough = ()=>{ bgmReady = true; if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } };
  a.onerror = ()=>{ bgmReady = false; };
  a.src = src;
  bgmEl = a;
  return a;
}
function startExternalBgm(){
  if (!bgmEl) return false;
  bgmEl.muted = false; bgmEl.volume = 0.55;
  const p = bgmEl.play();
  if (p && p.catch) p.catch(()=>{ bgmReady = false; });   // 被拦了就等下次手势再试
  return true;
}
function audioInit(){
  if (AC) return;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  masterGain = AC.createGain(); masterGain.gain.value = 0.9; masterGain.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0.10; musicGain.connect(masterGain);
  if (!bgmReady) startMusic();      // 有外部 BGM 就不放合成乐
}
function noiseBuf(dur){
  const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function env(node, t0, a, d, peak){
  node.gain.setValueAtTime(0.0001, t0);
  node.gain.exponentialRampToValueAtTime(peak, t0 + a);
  node.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
}
function tone(freq, t0, a, d, gain, type){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  env(g, t0, a, d, gain);
  o.connect(g).connect(masterGain); o.start(t0); o.stop(t0 + a + d + 0.02);
}
function noiseHit(t0, dur, gain, hp){
  const src = AC.createBufferSource(); src.buffer = noiseBuf(dur);
  const f = AC.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || 900;
  const g = AC.createGain(); env(g, t0, 0.005, dur, gain);
  src.connect(f).connect(g).connect(masterGain); src.start(t0); src.stop(t0 + dur + 0.02);
}
function sfx(kind){
  if (!AC) return;
  const t = AC.currentTime; audioPlays++;
  if (kind === 'shot'){
    noiseHit(t, 0.25, 0.9, 1600); tone(70, t, 0.005, 0.22, 0.7, 'sine'); tone(140, t, 0.004, 0.12, 0.35, 'square');
  } else if (kind === 'swing'){
    noiseHit(t, 0.16, 0.25, 2200);
  } else if (kind === 'hit'){

function startMusic(){
  if (musicTimer) return;
  const beat = 0.5, roots = [55, 55, 61.7, 49];
  let k = 0;
  musicTimer = setInterval(()=>{
    if (!AC || !musicOn) return;
    const t = AC.currentTime + 0.02;
    if (k % 4 === 0){                                  // 底鼓
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      env(g, t, 0.004, 0.16, 0.5); o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.2);
    }
    if (k % 2 === 1){                                  // 反拍 hi-hat
      const src = AC.createBufferSource(); src.buffer = noiseBuf(0.05);
      const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
      const g = AC.createGain(); env(g, t, 0.002, 0.05, 0.12);
      src.connect(f).connect(g).connect(musicGain); src.start(t); src.stop(t + 0.07);
    }
    if (k % 8 >= 2 && k % 8 <= 7 && Math.random() < 0.8){   // 简易琶音旋律
      const scale = [220, 261.6, 293.7, 349.2, 392, 349.2, 293.7, 261.6];
      const f = scale[(k + (k / 8 | 0)) % scale.length];
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
      env(g, t, 0.01, 0.22, 0.10); o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.3);
    }
    if (k % 8 === 0){                                  // 每两小节一个低音
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(roots[(k / 8 | 0) % 4], t);
      env(g, t, 0.01, 0.9, 0.5); o.connect(g).connect(musicGain); o.start(t); o.stop(t + 1.0);
    }
    k++;
  }, beat * 1000);
}

function tryJump(f){
  if (f.stun > 0) return;
  if (f.y <= 0.01 && f.vy <= 0) f.jumps = 0;
  if (f.jumps >= 2) return;                 // 二段跳
  sfx('jump');
  f.vy = JUMP_V * (f.jumps === 0 ? 1 : 0.88);
  f.jumps++;
  f.set('jump', {force:true});
}

// 平台碰撞：下落时穿过平台顶面就站上去
function physics(f, dt){
  const wasY = f.y;
  f.vy -= GRAV * dt;
  f.y += f.vy * dt;
  let landed = f.y <= 0;
  let standY = 0;
  for (const pf of PLATFORMS){
    if (f.x > pf.x - 30 && f.x < pf.x + pf.w + 30){
      const top = GROUND - pf.y;
      const topH = pf.y;
      if (f.vy <= 0 && wasY >= topH - 4 && f.y <= topH){ standY = Math.max(standY, topH); landed = true; }
    }
  }
  if (landed){
    f.y = standY; f.vy = 0; f.jumps = 0;
    if (f.state === 'jump'){ f.set('idle'); sfx('land'); for (let i=0;i<7;i++) dusts.push({x: f.x + (Math.random()*2-1)*26, y: 0, vx: (Math.random()*2-1)*90, vy: 40+Math.random()*70, t: 0}); }
  }
}

function onPlatform(f){
  for (const pf of PLATFORMS){
    if (f.x > pf.x && f.x < pf.x + pf.w && Math.abs(f.y - pf.y) < 6) return true;
  }
  return false;
}

// ── 子弹 ──
const GUN_PIVOT = {x: 16, y: 126};     // 由骨架算出来的手腕位置：前 16px、离地 126px
function gunPivot(f){
  return [ f.x + f.face * GUN_PIVOT.x, GROUND - GUN_PIVOT.y - (f.y || 0) ];
}
let freeAim = true;           // 默认：枪口自由跟随目标（F2 可切回跟姿势对齐）
function gunAim(f){
  const [px, py] = gunPivot(f);
  const tx = p1.x, ty = GROUND - 250 - (p1.y || 0);
  let ang = Math.atan2(ty - py, tx - px);
  if (!freeAim){
    // 和预渲的持枪姿势对齐：面朝左时基准是 π，偏差限幅 ±14°
    const base = f.face < 0 ? Math.PI : 0;
    let d = Math.atan2(Math.sin(ang - base), Math.cos(ang - base));
    const lim = (f.state === 'aimUp' || f.state === 'fireUp') ? 0.62 : 0.24;
    d = Math.max(-lim, Math.min(lim, d));
    ang = base + d;
  }
  return [px, py, ang];
}
function drawHeldMusket(f){

  gunDrawCount++;

  }

  ctx.lineTo(x1, h*0.30);

  ctx.strokeStyle = '#6a6c72'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, -h*0.30); ctx.lineTo(x1 + L*0.16, 0); ctx.stroke();
  ctx.restore();
}

function muzzlePoint(f){
  const s = f.scale;
  const native = (f === p2) ? -1 : 1;
  const flip = f.face !== native;
  const ANG = {aimM55:-55, fireM55:-55, aimM25:-25, fireM25:-25, aimP0:0, fireP0:0, aimP18:18, fireP18:18,
               aimUp:-56, fireUp:-56};
  if (ANG[f.state] !== undefined){
    const [px, py] = gunPivot(f);
    const a = ANG[f.state] * Math.PI / 180;
    const L = 0.90 * 640 * f.scale;                    // 枪管长度（对齐预渲）
    return [px + Math.cos(a) * L * (f.face < 0 ? -1 : 1), py + Math.sin(a) * L];
  }
  if (['fire','fireUp','aim','aimUp'].includes(f.state)){
    const [px, py, ang] = gunAim(f);
    const L = 0.55 * 640 * s;
    return [ px + Math.cos(ang) * 0.62 * L, py + Math.sin(ang) * 0.62 * L ];
  }
  const M = (f.state === 'fireUp') ? MUZZLE_UP : MUZZLE_CLIP;
  const cx = flip ? (1280 - M.x) : M.x;
  return [ f.x + (cx - 640) * s, GROUND - 640 * s + M.y * s - (f.y || 0) ];
}
function spawnBullet(f){
  window.__shotCount = (window.__shotCount || 0) + 1;
  const [mx, my] = muzzlePoint(f);
  const tx = p1.x, ty = GROUND - CHEST - (p1.y || 0);   // 瞄打手胸口
  let dx = tx - mx, dy = ty - my;
  if (f.wetShot){                                   // 被打了：子弹偏 ±14°
    const a = (Math.random() * 2 - 1) * 0.24 * (f.face > 0 ? 1 : -1);
    const cs = Math.cos(a), sn = Math.sin(a);
    [dx, dy] = [dx * cs - dy * sn, dx * sn + dy * cs];
    f.wetShot = false;
  }
  const L = Math.hypot(dx, dy) || 1;
  let sp = 640;
  let pierce = (f === p2 && f.pierceShot);
  if (f === p2 && CFG.alwaysCharged){                 // 不可思议：普通射击也带蓄能
    pierce = true;
    f.pierceDmg = Math.round(DMG.gunChargeBase * Math.pow(3, (f.frenzyCount || 0) + 1));
  }
  if (pierce){
    window.__pierceShots = (window.__pierceShots || 0) + 1;
    sp *= CFG.chargeSpeedX;
    f.pierceVolley = (f.pierceVolley || 1) - 1;
    if (f.pierceVolley > 0) f.pierceNext = 0.5;        // 0.5 秒后补第二发
    else { f.pierceShot = false; f.pierceNext = 0; }
  }                    // 速度 ×3
  sfx('shot');
  bullets.push({x: mx, y: my, vx: dx/L*sp, vy: dy/L*sp, pierce, dmg: pierce ? f.pierceDmg : DMG.gunRanged,
                homing: pierce ? CFG.homing : 0, noReflect: pierce && !CFG.reflectable,
                dir: Math.sign(dx) || f.face, alive: true, t: 0, owner: 'gun'});
  sparks.push({x: mx + f.face*6, y: my, t: -0.05});
}
function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if (b.homing > 0 && b.t < b.homing && b.owner === 'gun'){
      const tx = p1.x, ty = GROUND - CHEST - (p1.y || 0);
      const dx = tx - b.x, dy = ty - b.y, L = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const turn = Math.min(1, dt * 6);                 // 追踪转向速度
      b.vx += (dx / L * sp - b.vx) * turn;
      b.vy += (dy / L * sp - b.vy) * turn;
    }
    b.x += (b.vx !== undefined ? b.vx : b.dir * b.speed) * dt;
    b.y += (b.vy || 0) * dt;
    b.t += dt;
    const tgt = (b.owner === 'player') ? p2 : p1;
    const hb = hurtBox(tgt);
    const hitX = b.x > hb.x - 10 && b.x < hb.x + hb.w + 10;
    const hitY = b.y > hb.y - 10 && b.y < hb.y + hb.h + 10;
    if (hitX && hitY && tgt.invuln <= 0 && tgt.hp > 0){
      {
        const base = b.dmg || DMG.gunRanged;   // 反弹回来的子弹沿用原本的伤害
        const mult = (b.owner === 'gun' && p2.frenzy) ? p2.dmgMult : 1;
        const dealt = base * mult;
        tgt.hurt(dealt, b.dir);
        if (b.owner === 'gun' && p2.frenzy) p2.chargeDmg += dealt;   // 只有狂化期间才蓄能
        if (b.owner === 'gun' && (p2.frenzy || b.pierce || p2.healGlow > 0)){   // 狂化/蓄能/余韵都吸血
          const want = base * mult * SK.frenzyHeal;
          const room = p2.maxHp - p2.hp;
          const healed = Math.min(room, want);
          p2.hp += healed;
          p2.shield += (want - healed);
          p2.shieldMax = Math.max(p2.shieldMax || 0, p2.shield);
        }
      }
      window.__bulletHits = (window.__bulletHits || 0) + 1;
      hitstop = .07; shake = 10; flash = .16;
      sparks.push({x: b.x, y: b.y, t: 0});
      b.alive = false;
    }
    // 挡子弹的平台（穿透弹无视）
    for (const pf of PLATFORMS){
      if (b.pierce) break;
      const py = GROUND - pf.y;
      if (b.x > pf.x && b.x < pf.x + pf.w && Math.abs(b.y - py) < pf.h/2 + 6){ b.alive = false; }
    }
    if (b.x < -80 || b.x > WORLD + 80 || b.t > 4) b.alive = false;
    if (!b.alive) bullets.splice(i, 1);
  }
}
function tryDeflect(){
  const u = p1.t / (SPRITES[p1.act].n / FPS);
  if (p1.state !== 'parry' || u < .15 || u > .75) return;
  for (const b of bullets){
    if (b.noReflect) continue;                       // 不可思议：挡不下来

    if (Math.abs(b.y - (GROUND - 250 - (p1.y||0))) > 140) continue;
    b.owner = 'player'; b.dir = -b.dir; b.t = 0;

    b.vy = (b.vy || 0) * -0.6 - 90;      // 弹回去时略微上扬
    sparks.push({x: b.x, y: b.y, t: 0});

// ── 小物件被挥击打飞 ──
function hitProps(a){

  if (!win) return;
  const u = a.t / (SPRITES[a.act].n / FPS);

  for (const pr of PROPS){

      const L = Math.hypot(dx, dy) || 1;
      pr.projectile = true; pr.dmg = DMG.brawlerHeavy;

    } else {

      pr.vx = a.face * (520 + Math.random()*260);

function propHits(){

    const speed = Math.hypot(pr.vx || 0, pr.vy || 0);
    if (speed < 240) continue;                    // 只有飞起来的才算

function updateProps(dt){
  for (const pr of PROPS){
    if (!pr.alive) continue;
    if (pr.projectile){                       // 直线弹道：不受重力，命中枪手
      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      pr.rot += pr.spin * dt;
      pr.life -= dt;

        applyDamage(p2, pr.dmg, Math.sign(pr.vx) || 1);

        if (p1.counterCd <= 0 && p1.takenTotal > 0){

          applyCounterDamage(p2, extra, Math.sign(pr.vx) || 1);

          flash = Math.max(flash, .25); shake = Math.max(shake, 16);
        }
        pr.projectile = false; pr.vx = 0; pr.vy = 0; pr.hitCd = 0.8;
        hitstop = Math.max(hitstop, .1); shake = Math.max(shake, 16); flash = Math.max(flash, .22);
        sparks.push({x: p2.x, y: GROUND - CHEST, t: 0, big: true, rgba: 'rgba(255,180,60,'});
      }
      if (pr.x < 0 || pr.x > WORLD || pr.y < -200){ pr.x = Math.max(40, Math.min(WORLD - 40, pr.x)); pr.projectile = false; pr.vx = 0; pr.vy = 0; }
      return;
    }
    if (pr.vx || pr.vy || pr.y > 0){
      pr.vy -= 1700 * dt;
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      pr.rot += pr.spin * dt;
      if (pr.y <= 0){ pr.y = 0; pr.vy = -pr.vy * 0.35; pr.vx *= 0.7; pr.spin *= 0.6;
        if (Math.abs(pr.vy) < 40){ pr.vy = 0; pr.vx *= 0.3; }
      }
      if (pr.hitCd > 0) pr.hitCd -= dt;
      // 物件永不消失：滚出边界就停住、落地就留在原地
      if (pr.x < 0 || pr.x > WORLD){ pr.x = Math.max(40, Math.min(WORLD - 40, pr.x)); pr.vx = 0; pr.vy = 0; pr.y = 0; }
      if (pr.y <= 0 && Math.abs(pr.vx) < 6 && Math.abs(pr.vy) < 6){ pr.vx = 0; pr.vy = 0; pr.y = 0; }
    }
  }
}

// ── 命中判定 ──
function hitBox(a, reach){
  const x0 = a.face > 0 ? a.x + 10 : a.x - reach;
  return {x: x0, y: GROUND - BODY_H * 0.82 - (a.y||0), w: reach, h: BODY_H * 0.55};   // 肩到膝
}
function hurtBox(f){
  if (f.slideT > 0)                                   // 滑铲：横长方形（宽 150 / 高 78）
    return {x: f.x - 75, y: GROUND - 78 - (f.y||0), w: 150, h: 78};
  return {x: f.x - 26, y: GROUND - BODY_H - (f.y||0), w: 52, h: BODY_H};
}
function inBox(box, b){
  const h = hurtBox(b);
  return h.x < box.x + box.w + 6 && h.x + h.w > box.x - 6 &&
         h.y < box.y + box.h + 6 && h.y + h.h > box.y - 6;
}

function checkHit(a, b, windows, dmg, rangeOk){
  const win = windows[a.state];
  if (!win) return;
  const u = a.t / (SPRITES[a.act].n / FPS);
  if (u < win[0] || u > win[1] || a.hitDone) return;
  if (b.invuln > 0 || !rangeOk()) return;
  if (b === p2 && p2.state === 'block' && (b.blockT || 0) > 0){    // 格挡：不掉血，出火花
    a.hitDone = true;
    sfx('block');
    hitstop = .05; shake = 8; flash = .15;
    sparks.push({x: (a.x + b.x)/2, y: GROUND - 300 - (b.y||0), t: 0});
    return;
  }
  a.hitDone = true;
  // 连击：1.2 秒内连续命中，第三下开始加伤害
  combo = (comboT > 0) ? combo + 1 : 1;
  comboT = 1.2;
  const bonus = combo >= 3 ? Math.min(6, (combo - 2) * 2) : 0;
  dmg += bonus;
  sfx(b.hp <= 0 ? 'ko' : (combo >= 3 ? 'block' : 'hit'));
  if (a === p2 && p2.frenzy) dmg *= p2.dmgMult;
  let counterExtra = 0;
  if (CFG.skills && a === p1 && !a.forcePhase && p1.counterCd <= 0 && p1.takenTotal > 0 && !p1.forcePool){   // 还击（全力期间不抢跑）
    counterExtra = Math.round(p1.takenTotal);
    p1.takenTotal = 0;
    p1.counterCd = SK.counterReady;
    showSkill('还击！', '+' + counterExtra + ' 伤害', '#3c8ce0');
    flash = Math.max(flash, .25); shake = Math.max(shake, 18);
    floatText(b.x, GROUND - BODY_H - 40, '+' + counterExtra, '#3c8ce0');
  }
  b.hurt(dmg, Math.sign(b.x - a.x));
  if (counterExtra > 0) applyCounterDamage(b, counterExtra, Math.sign(b.x - a.x));
  if (a === p2 && p2.frenzy){
    p2.chargeDmg += dmg;
    const want = dmg * SK.frenzyHeal, room = p2.maxHp - p2.hp;
    const healed = Math.min(room, want);
    p2.hp += healed; p2.shield += (want - healed);
    p2.shieldMax = Math.max(p2.shieldMax || 0, p2.shield);
  }
  hitstop = (a.state === 'swing2') ? .14 : .09;
  shake = (a.state === 'swing2') ? 20 : 14;
  flash = (a.state === 'swing2') ? .28 : .22;
  sparks.push({x: (a.x + b.x)/2, y: GROUND - 260 - (b.y||0), t: 0});
}

// ── AI ──
function aiStep(dt){
  // 贴身计时：放在最前面，换弹/出招/硬直期间也照样累计
  const dNow = Math.abs(p1.x - p2.x);
  if (dNow < LEAP_RANGE) closeT += dt;
  else if (dNow > LEAP_RANGE * 1.6) closeT = 0;

  if (p2.stun > 0 || over) return;
  // （换弹的早退放到计时之后）
  if (/^fire/.test(p2.state) || ['club','club2','block','dodge','reload','leap'].includes(p2.state)) return;   // 正在出招/格挡/闪避就不打断
  const faceTo = p1.x > p2.x ? 1 : -1;
  p2.face = faceTo;
  const d = Math.abs(p1.x - p2.x);

  if (p2.reloading > 0){                              // 换弹中：退到 560 以外再装
    if (d < 560){ p2.x -= faceTo * 330 * dt; p2.set('retreat'); }
    return;
  }
  // 有物件朝自己飞过来（重击弹道）：格挡或跳
  for (const pr of PROPS){
    if (!pr.projectile) continue;
    const dxp = pr.x - p2.x;
    if (Math.abs(dxp) < 320 && Math.sign(-dxp) === Math.sign(pr.vx)){
      if (blockCd <= 0){ p2.set('block', {force:true}); blockCd = 1.0; p2.blockT = 0.6; return; }
      if (p2.jumps === 0 && Math.random() < 0.5){ tryJump(p2); return; }
    }
  }
  // 收尾：对方残血又贴脸 → 抡枪托
  if (p1.hp < 260 && d < 220 && attackCd <= 0){
    p2.set(Math.random() < 0.5 ? 'club' : 'club2', {force:true});
    attackCd = 0.9; return;
  }
  // 对方在挥击/硬直：立刻补一枪（抓到空档）
  if (fireCd <= 0 && d > 180 && (p1.state === 'swing2' || p1.stun > 0)){
    const dy2 = (GROUND - 250 - (p1.y||0)) - (GROUND - 126 - (p2.y||0));
    const deg2 = Math.atan2(dy2, Math.abs(p1.x - p2.x)) * 180 / Math.PI;
    let t2 = 'P0';
    if (deg2 < -40) t2 = 'M55'; else if (deg2 < -12) t2 = 'M25'; else if (deg2 > 9) t2 = 'P18';
    p2.set('fire' + t2, {force:true}); fireCd = 1.35;
    return;
  }
  // 枪已上膛且在射程内：立刻开火（不再先走位）
  if (fireCd <= 0 && d > 150 && d < 1100){
    const dyF = (GROUND - 250 - (p1.y||0)) - (GROUND - 126 - (p2.y||0));
    const degF = Math.atan2(dyF, Math.abs(p1.x - p2.x)) * 180 / Math.PI;
    let tF = 'P0';
    if (degF < -40) tF = 'M55'; else if (degF < -12) tF = 'M25'; else if (degF > 9) tF = 'P18';
    p2.set('fire' + tF, {force:true});
    fireCd = 1.15;
    return;
  }

  // 风筝：太近先退（不等射击冷却，随时退）
  if (d < 330){
    p2.x -= faceTo * 330 * dt;
    p2.set('retreat');
    if (d > 200 && fireCd <= 0 && Math.random() < 0.35){   // 退的同时偶尔抬手一枪
      p2.set('fireP0', {force:true}); fireCd = 1.35;
    }
    return;
  }

  // 看到飞来的子弹就跳
  for (const b of bullets){
    if (b.owner === 'gun') continue;
    if (Math.abs(b.x - p2.x) < 260 && Math.abs(b.x - p2.x) > 60 && p2.y === 0 && p2.jumps === 0){
      tryJump(p2); return;
    }
  }
  if (p1.y > 40 && d < 260 && p2.y === 0){ tryJump(p2); return; }   // 跟跳 / 跳上平台   // 对方跳上来就跟着跳

  // 看到玩家挥击 → 闪避或格挡
  if ((p1.state === 'swing' || p1.state === 'swing2') && Math.abs(p1.x - p2.x) < 230){
    const r = Math.random();
    if (dodgeCd <= 0 && r < 0.30){ p2.set('dodge', {force:true}); dodgeCd = 1.4; return; }
    const heavyThreat = (p1.state === 'swing2');
    if (blockCd <= 0 && (r < (heavyThreat ? 0.85 : 0.62))){ p2.set('block', {force:true}); blockCd = 1.1; p2.blockT = 0.55; return; }
  }
  // 贴身计时：连续 3 秒被压着 → 立刻大跳后撤 200
  if (closeT > 3){
    closeT = 0;
    p2.leapT = 0.9; p2.leapDir = -faceTo; p2.leapX0 = p2.x; p2.leapShot = false;
    p2.set('leap', {force:true});
    sfx('jump');
    return;
  }

  // 距离 > 960 就疾跑冲过来，直到 200 以内
  if (d > 1500) p2.sprint = true;      // 距离过远：开始疾跑
  if (d <= 700) p2.sprint = false;     // 追到 700 就停
  if (p2.sprint){
    p2.x += faceTo * 520 * dt;
    p2.set('run');
    return;
  }

  if (d < 190){                       // 贴脸：能开枪就顶着打，否则枪托/后撤
    if (fireCd <= 0 && p2.reloading <= 0 && Math.random() < 0.55){
      p2.set('fireP0', {force:true}); fireCd = 1.5;
      return;
    }
    if (attackCd <= 0 && Math.random() < 0.5){
      p2.set(Math.random() < 0.5 ? 'club' : 'club2', {force:true});
      attackCd = 1.05;
      return;
    }
    if (d < 110 && closeT > 1.2){       // 被逼死角：后跳脱身
      p2.leapT = 0.9; p2.leapDir = -faceTo; p2.leapX0 = p2.x; p2.leapShot = false;
      p2.set('leap', {force:true}); closeT = 0;
      return;
    }
    p2.x -= faceTo * 300 * dt;
    p2.set('retreat');
    return;
  }
  if (fireCd <= 0 && d > 120){        // 射程内：按仰角选一套（枪是烤进帧里的）
    const dy = (GROUND - 250 - (p1.y||0)) - (GROUND - 126 - (p2.y||0));
    const deg = Math.atan2(dy, Math.abs(p1.x - p2.x)) * 180 / Math.PI;
    let tag = 'P0';
    if (deg < -40) tag = 'M55'; else if (deg < -12) tag = 'M25'; else if (deg > 9) tag = 'P18';
    p2.aimTag = tag;
    p2.set('aim' + tag);
    if (p2.t > .5){ p2.set('fire' + tag, {force:true}); fireCd = 1.5; }
    return;
  }
  if (d > 560){ p2.x += faceTo * 120 * dt; p2.set('walk'); return; }
  p2.set('idle');
}

  const dmg = Math.max(18, Math.round(p1.takenTotal));
  p1.counterCd = SK.counterReady;
  p1.takenTotal = 0;

  sfx('heavy');

  boom(p1.x, GROUND - CHEST, 200, 'rgba(60,140,224,');
  // 延迟到挥击命中时结算
  setTimeout(()=>{ if (!over && p2.hp > 0){ p2.hurt(dmg, Math.sign(p2.x - p1.x)); hitstop = .16; shake = 22; flash = .3; } }, 180);

// ── 玩家操控枪手 ──
function fireCharge(g = p2){
  if (!g.chargeReady) return;
  g.chargeReady = false;
  const dmg = Math.round(DMG.gunChargeBase * Math.pow(3, (g.frenzyCount || 0) + 1));
  const exp = Math.round(Math.log(dmg) / Math.log(3));
  const expr = Array(exp).fill('3').join('×');
  showSkill('发射！', `${expr} = ${dmg} × 2 发`, '#ff1f1f');
  flash = Math.max(flash, .35); shake = Math.max(shake, 16);
  g.pierceShot = true; g.pierceVolley = 2; g.pierceDmg = dmg;
  spawnBullet(g);
  g.frenzy = false; g.frenzyLeft = 0; g.frenzyT = 0;
  g.dmgMult = 1; g.frenzyGlow = false;
  g.frenzyCd = SK.frenzyCd;
  g.healGlow = 1.2;                 // 余韵：这 1.2 秒内的命中继续回血
}
