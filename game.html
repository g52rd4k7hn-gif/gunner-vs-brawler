    if (keys['a']) mv--;
    if (keys['d']) mv++;
    if (mv !== 0){ g.x += mv * 172 * (keys['shift'] ? 1.3 : 1) * dt; g.face = mv; }
    return;
  }
  g.face = foe.x > g.x ? 1 : -1;

  let mv = 0;
  if (keys['a']) mv--;
  if (keys['d']) mv++;
  if (mv !== 0){ g.x += mv * 240 * (keys['shift'] ? 1.6 : 1) * dt; g.face = mv; g.set('walk'); }
  else g.set('idle');

  if (jumpReq){ jumpReq = false; tryJump(g); }

  if (keys['j'] && g.chargeReady){ fireCharge(g); return; }   // J：蓄能就绪时发射蓄能弹
  if (keys['u']){ g.set(Math.random() < 0.5 ? 'club' : 'club2', {force:true}); return; }   // U：枪托
  if (keys['j'] && fireCd <= 0 && g.reloading <= 0){
    const dy = (GROUND - CHEST - (foe.y||0)) - (GROUND - CHEST - (g.y||0));
    const deg = Math.atan2(dy, Math.abs(foe.x - g.x)) * 180 / Math.PI;
    let tag = 'P0';
    if (deg < -40) tag = 'M55'; else if (deg < -12) tag = 'M25'; else if (deg > 9) tag = 'P18';
    g.set('fire' + tag, {force:true});
    fireCd = 1.2;
    return;
  }
  // K：小后跳（无位移射击）；K+W 或贴身 3 秒后：大后跳（带空中射击）
  // K：滑铲（默认）；K+W / Q / 贴身 3 秒 → 大后跳（空中开枪）
  if ((keys['k'] || keyReq.q) && g.slideT <= 0 && g.leapT <= 0 && g.state !== 'leap'){
    const wantBig = keyReq.q || (keys['k'] && (keys['w'] || jumpReq)) || closeT >= 3;
    if (wantBig){
      keyReq.q = false;
      g.leapT = 0.9; g.leapDir = -g.face; g.leapX0 = g.x; g.leapShot = false;
      g.leapDist = LEAP_DIST; g.leapShoot = true;
      closeT = 0;
      g.set('leap', {force:true});
      sfx('jump');
      return;
    }
    g.set('slide', {force:true});
    g.slideT = DODGE_TIME;
    g.slideVx = g.face * (2 * DODGE_DIST / DODGE_TIME);
    g.invuln = DODGE_INVULN;
    sfx('land');
    return;
  }
  // L：格挡（持续整个动作）
  if (parryReq && blockCd <= 0){
    parryReq = false; blockCd = 1.4;
    g.set('block', {force:true});
    g.blockT = SPRITES[g.act].n / FPS;        // 有效时间 = 动作长度
    return;
  }
  // Q：后跳拉开
  if (keyReq.q && g.leapT <= 0 && g.state !== 'leap'){
    keyReq.q = false;
    g.leapT = 0.9; g.leapDir = -g.face; g.leapX0 = g.x; g.leapShot = false;
    g.set('leap', {force:true});
    sfx('jump');
    return;
  }
  // E：开启狂化（无视血量，只看冷却）
  if (keyReq.e && g.frenzyCd <= 0 && !g.frenzy){
    keyReq.e = false;
    g.frenzy = true; g.dmgMult = 1; g.chargeDmg = 0;
    g.frenzyLeft = SK.frenzyDur; g.frenzyT = 1.4; g.frenzyGlow = true;
    g.chargeAt = 1 + Math.random() * 3; g.chargeTotal = g.chargeAt;
    g.frenzyCount = (g.frenzyCount || 0) + 1;
    showSkill('枪手 · 狂化！', '蓄能弹准备中', '#ff2d2d');
    flash = Math.max(flash, .5); shake = Math.max(shake, 18);
    return;
  }
  keyReq.e = false;
  if (keys['k'] && g.slideT <= 0){ g.set('dodge', {force:true}); }
  if (parryReq){ parryReq = false; if (blockCd <= 0){ g.set('block', {force:true}); g.blockT = 0.5; blockCd = 1.2; } }
}

// ── AI 操控打手 ──
let slideAiCd = 0;
function aiBrawler(dt){
  if (slideAiCd > 0) slideAiCd -= dt;
  if (dodgeCd > 0) dodgeCd -= dt;
  const f = p1, t = p2;
  if (f.stun > 0 || over || f.reviving > 0) return;
  if (f.downed) return;                                     // 最后的反击：倒地无法行动
  if (f.forcePhase || f.pullT > 0) return;                 // 全力期间锁定，只能做这个动作
  if (['swing','swing2','hit','ko','dodge','pull','parry'].includes(f.state)) return;
  const d = Math.abs(t.x - f.x);
  f.face = t.x > f.x ? 1 : -1;

  // 全力（不可思议：立即；一丝神力：5 秒预警的削弱版）
  if ((CFG.brawlerSkills || CFG.brawlerSkillsWeak) && f.forceCd <= 0 && f.takenTotal > 500 && d > 120 && !f.forcePhase){
    f.forcePhase = 1;
    f.forcePool = Math.round(f.takenTotal);          // 快照：避免中途被还击清空
    const insaneForce = !!CFG.brawlerSkills;
    f.forceWarn = insaneForce ? 0.8 : 5;             // 预警时长
    f.pullSpeed = insaneForce ? 1200 : 650;          // 吸附速度（神力 650 / 不可 1200）
    f.pullDur   = insaneForce ? 99 : (playerSide === 'gunner' ? 8 : 7);   // 吸附时长（不可=吸到为止）
    f.forceT = f.forceWarn;
    f.forceCd = CFG.brawlerSkills ? (f.lastStand ? 5 : 15) : 25;   // 不可 15s（不倒 5s）/ 神力 25s
    f.set('pull', {force:true});
    showSkill('木易 · 全力（预警）', CFG.brawlerSkills ? '即将吸附！' : '5 秒后吸附', '#a050ff');
    sfx('charge');
    return;
  }
  if (false){
    f.pullT = 0.8; f.pullTarget = t; f.pullX0 = t.x;
    f.set('pull', {force:true});
    f.forceCd = f.lastStand ? 4 : 10;
    sfx('charge');
    return;
  }
  // 抓换弹空档：贴上去打
  if (p2.reloading > 0 && d > 120){
    f.x += f.face * 330 * dt;
    f.set('run');
    return;
  }
  // 中距离：滑铲贴脸（460px）
  if (d > 330 && d < 520 && f.slideT <= 0 && slideAiCd <= 0){
    f.set('slide', {force:true});
    f.slideT = DODGE_TIME; f.slideVx = f.face * (2 * DODGE_DIST / DODGE_TIME);
    f.invuln = DODGE_INVULN; slideAiCd = 6.0;
    sfx('land');
    return;
  }
  // 枪口抬起来瞄你了：左右横移别站桩
  if (/^aim/.test(p2.state) && d < 420 && dodgeCd <= 0 && Math.random() < 0.35){
    f.x -= f.face * 260 * dt; f.set('retreat'); dodgeCd = 0.9;
    return;
  }
  if (d > 200){ f.x += f.face * 230 * dt; f.set('walk'); return; }
  if (attackCd <= 0){
    f.set(Math.random() < 0.4 ? 'swing2' : 'swing', {force:true});
    attackCd = 0.75;
    return;
  }
  f.set('idle');
}

// ── 主循环 ──
function step(dt){
  // 枪手跑出画面 → 边缘箭头提示
  if (!over){
    const sx = p2.x - cam;
    if (sx < 40 || sx > CW - 40){
      const left = sx < 40;
      const ay = GROUND - 200 - (p2.y || 0) + camY;
      ctx.save();
      ctx.fillStyle = 'rgba(200,60,50,.9)';
      ctx.beginPath();
      const ax = left ? 22 : CW - 22, d = left ? -1 : 1;
      ctx.moveTo(ax, ay); ctx.lineTo(ax + d * 18, ay - 12); ctx.lineTo(ax + d * 18, ay + 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(200,60,50,.85)'; ctx.font = '12px Menlo';
      ctx.textAlign = left ? 'left' : 'right';
      ctx.fillText(Math.round(Math.abs(p2.x - p1.x)) + 'px', left ? 46 : CW - 46, ay + 4);
      ctx.restore();
    }
  }
  if (AUTO.length){
    autoT += dt;
    if (AUTO.includes('jump') && p1.y === 0 && p1.jumps === 0 && autoT > 1.1){ autoT = 0; tryJump(p1); }
  }
  if (fireCd > 0) fireCd -= dt;
  if (attackCd > 0) attackCd -= dt;
  if (parryCd > 0) parryCd -= dt;
  if (comboT > 0){ comboT -= dt; if (comboT <= 0) combo = 0; }
  if (dodgeCd > 0) dodgeCd -= dt;
  if (p1.counterCd > 0) p1.counterCd -= dt;
  // 滑铲：位移 + 无敌
  for (const f of [p1, p2]){
    if (f.slideT > 0){
      const k = f.slideT / DODGE_TIME;                  // 1 → 0 线性减速
      f.x += f.slideVx * k * dt;
      f.slideT -= dt;
      if (f.slideT <= 0){ f.slideT = 0; f.slideVx = 0; }
    }
  }
  if (blockCd > 0) blockCd -= dt;
  if (p2.blockT > 0) p2.blockT -= dt;
  // 脚步声：跟着移动状态走
  if ((p1.state === 'walk' || p1.state === 'run') && p1.y === 0){
    stepT -= dt;
    if (stepT <= 0){ sfx('step'); stepCount++; stepT = p1.state === 'run' ? 0.26 : 0.42; }
  } else stepT = 0;
  updateFloats(dt);                    // 飘字不受顿帧影响
  // 狂化中的蓄能弹：1~4 秒随机后发射（最后 1 秒倒计时）
  if (p2.frenzy && p2.chargeAt > 0){
    p2.chargeAt -= dt;
    p2.chargeWarn = Math.max(0, Math.min(1, p2.chargeAt));     // 最后 1 秒才显示
    if (p2.chargeAt <= 0){
      p2.chargeAt = 0; p2.chargeWarn = 0;
      p2.chargeReady = true;                       // 就绪，等开火键
      if (playerSide !== 'gunner') fireCharge(p2);  // 只有 AI 才自动扣扳机
      else showSkill('蓄能就绪', '按 J 发射', '#ff8a3c');
    }
  }
  // 蓄能弹第二发
  if (p2.pierceNext > 0) window.__pnTicks = (window.__pnTicks || 0) + 1;
  if (p2.healGlow > 0) p2.healGlow -= dt;
  if (p2.pierceNext > 0){
    p2.pierceNext -= dt;
    if (p2.pierceNext <= 0){ p2.pierceNext = 0; spawnBullet(p2); }
  }
  if (hitstop > 0){ hitstop -= dt; return; }

  // 玩家
  // 枪手·狂化：残血时永久强化，头部红光
  if (p2.frenzy && p2.frenzyLeft > 0){
    p2.frenzyLeft -= dt;
    if (p2.frenzyLeft <= 0){                                   // 狂化结束
      p2.frenzy = false; p2.dmgMult = 1; p2.frenzyGlow = false; p2.frenzyCd = SK.frenzyCd;
      p2.frenzyT = 0;

    }
  }
  if (CFG.skills && !p2.frenzy && p2.reviving <= 0 && p2.frenzyCd <= 0 && p2.hp > 0){   // 冷却好了就放
    p2.frenzy = true;
    p2.dmgMult = 1; p2.chargeDmg = 0;
    p2.chargeAt = 1 + Math.random() * 3;              // 狂化：开始蓄能
    p2.chargeAt = 1 + Math.random() * 3;           // 1~4 秒后发射
    p2.chargeTotal = p2.chargeAt;
    p2.frenzyCount = (p2.frenzyCount || 0) + 1;    // 第几次狂化
    p2.pierceShot = false; p2.pierceVolley = 0; p2.pierceNext = 0;
    p2.frenzyLeft = SK.frenzyDur;
    p2.frenzyT = 1.4; p2.frenzyGlow = true;
    showSkill('枪手 · 狂化！', '伤害 ×3', '#ff2d2d');
    flash = Math.max(flash, .5); shake = Math.max(shake, 18);
    boom(p2.x, GROUND - CHEST * 1.9, 220, 'rgba(255,40,40,');
    sfx('ko');
  }
  if (p2.frenzyT > 0) p2.frenzyT -= dt;
  if (p2.immortalCd > 0) p2.immortalCd -= dt;
  if (p2.frenzyCd > 0 && !p2.frenzy) p2.frenzyCd -= dt;

  // 不朽：5 秒读条
  if (p2.reviving > 0){
    p2.reviving -= dt;
    if (Math.random() < 0.5)                                   // 向上飘的紫粒子
      sparks.push({x: p2.x + (Math.random()*2-1)*70, y: GROUND - (p2.y||0) - Math.random()*120, t: 0, big: true, rgba: 'rgba(178,60,255,'});
    if (p2.reviving <= 0){
      p2.reviving = 0;
      p2.hp = Math.round(p2.maxHp * (p2.reviveFull ? 1 : 0.3));
      p2.set('idle', {force:true});
      p2.invuln = 1.5;
      showSkill('枪手 · 复活！', p2.reviveFull ? '满血归来' : '30% 血归来', '#b23cff');
      // 复活冲击波：把附近的人打飞 1000px
      if (p1.hp > 0 && Math.abs(p1.x - p2.x) < 520){
        p1.knockT = 0.9; p1.knockDist = 1000 * CFG.knockbackX;
        p1.knockDir = Math.sign(p1.x - p2.x) || 1;
        p1.knockX0 = p1.x;
        p1.set('leap', {force:true});
        window.__knockCount = (window.__knockCount || 0) + 1;
        p1.invuln = Math.max(p1.invuln, 0.3);
        shake = Math.max(shake, 26); flash = Math.max(flash, .35);
        boom(p2.x, GROUND - CHEST, 320, 'rgba(178,60,255,');
        sfx('ko');
      }
      flash = Math.max(flash, .45); shake = Math.max(shake, 16);
      boom(p2.x, GROUND - CHEST, 260, 'rgba(178,60,255,');
      for (let i = 0; i < 26; i++) sparks.push({x: p2.x, y: GROUND - 40 - i*6, t: 0, big: true, rgba: 'rgba(200,120,255,'});
    }
    return;                                                    // 读条期间不做别的
  }

  if (playerSide === 'brawler' && p1.stun <= 0 && !over){
    if (['idle','walk','run'].includes(p1.state)){
      let mv = 0;
      if (keys['a']) mv--;
      if (keys['d']) mv++;
      const run = !!(keys['shift']);
      if (mv !== 0){ p1.x += mv * 260 * (run?1.95:1) * dt; p1.face = mv; p1.set(run?'run':'walk'); }
      else p1.set('idle');
      if (jumpReq){ jumpReq = false; tryJump(p1); }
      if (keys['j'] && keys['shift'] && (p1.state==='idle'||p1.state==='walk'||p1.state==='run')){
        p1.chargeT = (p1.chargeT || 0) + dt;            // Shift+J 按住蓄力
        if (p1.chargeT > 0.35 && !p1.chargeSfx){ sfx('charge'); p1.chargeSfx = true; }
      } else if (keys['j'] && (p1.state==='idle'||p1.state==='walk'||p1.state==='run')){
        p1.set('swing', {force:true});                  // 普通横扫
        p1.chargeT = 0; p1.chargeSfx = false;
      } else if ((p1.chargeT || 0) > 0){
        const strong = p1.chargeT > 0.35;               // 松手：放重击
        p1.set('swing2', {force:true});
        p1.charged = strong;
        if (strong) sfx('heavy');
        p1.chargeT = 0; p1.chargeSfx = false;
      }
      if (keyReq.r && playerSide === 'brawler' && p1.forceCd <= 0 && p1.takenTotal > 500
      && !p1.forcePhase && ['idle','walk','run'].includes(p1.state)){
    keyReq.r = false;
    p1.forcePool = Math.round(p1.takenTotal);
    p1.forcePhase = 2;                       // 玩家操控：跳过预警，直接吸附
    p1.forceT = 7; p1.pullSpeed = 650; p1.pullDur = 7;
    p1.forceCd = 25;
    p1.set('pull', {force:true});
    showSkill('木易 · 全力！', '吸附中', '#a050ff');
    sfx('charge');
    return;
  }
  if (keys['k'] && p1.slideT <= 0 && p1.state !== 'dodge'){
        p1.set('dodge', {force:true});
        p1.slideT = DODGE_TIME; p1.slideVx = p1.face * (2 * DODGE_DIST / DODGE_TIME);   // 线性衰减下总位移 = DODGE_DIST
        p1.invuln = DODGE_INVULN;
        sfx('land');
      }
      if (parryReq){ parryReq = false;
        if (parryCd <= 0){ p1.set('parry',{force:true}); parryCd = .75; } }
    }
    if (p1.state === 'jump'){                       // 空中操控：跳跃时也能左右移动
      let mv = 0;
      if (keys['a']) mv--;
      if (keys['d']) mv++;
      if (mv !== 0){
        const airSpd = 172 * (keys['shift'] ? 1.5 : 1);   // 跳跃距离 +50%
        p1.x += mv * airSpd * dt;
        p1.face = mv;
      }
    }
    if (keys['j'] && p1.state === 'jump'){ p1.set('swing', {force:true}); p1.vy = Math.min(p1.vy, -200); }   // 空中挥击：略微下坠
    if (!['idle','walk','run','jump'].includes(p1.state)) { jumpReq = false; parryReq = false; }
    if (keys['w'] && ['jump'].includes(p1.state) && p1.jumps < 2 && jumpReq){ }
  } else if (playerSide === 'brawler') { jumpReq = false; parryReq = false; }

  // 玩家 = 枪手：自己控制枪手
  if (playerSide === 'gunner' && !over) gunnerInput(dt);
  if (playerSide === 'gunner') aiBrawler(dt); else aiStep(dt);

  // 打手·全力：预警 → 吸附 → 真伤
  if (p1.forcePhase){
    const t = p2;
    p1.forceT -= dt;
    if (p1.forcePhase === 1 || p1.forcePhase === 2){
      if (p1.state !== 'pull') p1.set('pull', {force:true});   // 动作循环，不中断
    }
    if (p1.forcePhase === 1){                      // 预警
      if (Math.random() < 0.35)
        sparks.push({x: p1.x + (Math.random()*2-1)*90, y: GROUND - 40 - Math.random()*180, t: 0, big: false, rgba: 'rgba(160,80,255,'});
      if (p1.forceT <= 0){ p1.forcePhase = 2; p1.forceT = p1.pullDur; sfx('charge'); }
    } else if (p1.forcePhase === 2){                // 吸附
      const dx = p1.x - t.x, sp = p1.pullSpeed || 1000;
      const step = sp * dt;
      if (Math.abs(dx) > 70) t.x += Math.sign(dx) * Math.min(step, Math.abs(dx) - 60);
      t.knockT = 0; t.leapT = 0; t.pullT = 0;
      if (Math.random() < 0.5)
        sparks.push({x: t.x + (Math.random()*2-1)*40, y: GROUND - 60 - Math.random()*140, t: 0, big: true, rgba: 'rgba(160,80,255,'});
      const grabbed = Math.abs(p1.x - t.x) < 90;
      if (grabbed || p1.forceT <= 0){            // 不可思议：吸到就停；神力：时间到
        p1.forcePhase = 3; p1.forceT = 0.35; p1.set('swing2', {force:true});
      }
    } else {                                        // 收招结算
      if (p1.forceT <= 0){
        p1.forcePhase = 0;
        const inRange = Math.abs(p2.x - p1.x) < 200;
        if (inRange){
          const dmg = CFG.brawlerSkills
            ? Math.round((p1.forcePool || p1.takenTotal) * 2)      // 不可思议：反击池 ×2
            : Math.round((p2.maxHp || MAX_HP) * 0.25);             // 一丝神力：目标最大生命的 25%
          p1.forcePool = 0;
          p1.takenTotal = Math.max(0, p1.takenTotal - 500);
          p2.shield = 0; p2.invuln = 0;
          applyDamage(p2, dmg, Math.sign(p2.x - p1.x) || 1);
          showSkill('全力！', dmg + ' 真实伤害', '#ff3bd0');
          window.__pullHit = (window.__pullHit || 0) + 1; window.__pullDmg = dmg;
          flash = Math.max(flash, .4); shake = Math.max(shake, 22); hitstop = Math.max(hitstop, .12);
          boom(p2.x, GROUND - CHEST, 260, 'rgba(255,60,200,');
        } else {
          showSkill('全力 · 落空', '目标脱离了范围', '#888');
        }
      }
    }
  }
  if (p1.forceCd > 0) p1.forceCd -= dt;

  if (p1.lastStand && p1.lastStandT > 0){
    p1.lastStandT -= dt;
    if (p1.hp < 1) p1.hp = 1;
    if (p1.lastStandT <= 0){ p1.hp = 0; p1.lastStand = false; p1.downed = false; }
  }

  // 被复活冲击波打飞
  if (p1.knockT > 0){
    const u = 1 - p1.knockT / 0.9;
    const k = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
    p1.x = p1.knockX0 + p1.knockDir * p1.knockDist * k;
    p1.y = Math.sin(Math.PI * Math.min(1, u)) * 300;
    p1.knockT -= dt;
    if (p1.knockT <= 0){ p1.knockT = 0; p1.y = 0; p1.set('idle'); }
  }
  // 大跳后撤：脚本控制位移 + 抛物线高度
  if (p2.leapT > 0){
    const u = 1 - p2.leapT / 0.9;
    const k = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;   // easeInOut
    p2.x = p2.leapX0 + p2.leapDir * (p2.leapDist || LEAP_DIST) * k;
    p2.leapMoved = Math.max(p2.leapMoved || 0, Math.abs(p2.x - p2.leapX0));
    p2.y = Math.sin(Math.PI * Math.min(1, u)) * LEAP_APEX;
    window.__maxLeapY = Math.max(window.__maxLeapY || 0, p2.y);
    if (p2.leapShoot !== false && !p2.leapShot && u > 0.45){   // 只有大后跳会在空中开枪
      p2.leapShot = true;
      spawnBullet(p2);
      flash = Math.max(flash, .12); shake = Math.max(shake, 6);
    }
    p2.leapT -= dt;
    if (p2.leapT <= 0){ p2.leapT = 0; p2.y = 0; p2.set('idle'); }
  } else {
    physics(p2, dt);
  }
  if (p1.knockT <= 0) physics(p1, dt);   // 被打飞期间由脚本控制
  p1.update(dt); p2.update(dt);
  // 开火：动作播到 18% 时生成一颗子弹
  for (const st of ['fire','fireUp','fireM55','fireM25','fireP0','fireP18']){
    if (p2.state === st && !p2.bulletDone){
      const u = p2.t / (SPRITES[p2.act].n / FPS);
      if (u > 0.18){ p2.bulletDone = true; spawnBullet(p2); }
    }
  }
  if (!/^fire/.test(p2.state)) p2.bulletDone = false;
  if (p2.frenzy && p2.extraShot){                     // 狂化·额外行动：补一枪
    p2.extraShot = false;
    p2.fireCdBoost = true;
  }

  // 开完枪 → 蹲下换弹 1.5 秒（这段时间不能开枪、不能动）
  if (p2.bulletDone && /^fire/.test(p2.state) && !p2.reloading){
    p2.reloading = CFG.reload;                    // 装弹时间（随难度）
    p2.set('reload', {force:true});
  }
  if (p2.reloading > 0){
    p2.reloading -= dt;
    if (p2.state !== 'reload') p2.set('reload', {force:true});
    if (p2.reloading <= 0){ p2.reloading = 0; p2.set('idle'); }
  }

  updateBullets(dt); tryDeflect(); updateProps(dt); propHits(); hitProps(p1); hitProps(p2); updateDust(dt);

  // 一次性动作播完 → 回待机
  for (const f of [p1, p2]){
    const sp = SPRITES[f.act];
    if (!sp.loop && f.done() && !['idle','ko'].includes(f.state)){
      if (f.state === 'retreat'){ f.t = 0; continue; }
      f.set('idle');
    }
  }

  // 边界 + 不许重叠
  p1.x = Math.max(40, Math.min(WORLD - 40, p1.x));
  p2.x = Math.max(40, Math.min(WORLD - 40, p2.x));
  // 只把枪手推开，玩家永远不会被"空气墙"顶住
  const gap = p2.x - p1.x;
  const MIN_GAP = 26;
  if (Math.abs(gap) < MIN_GAP && Math.abs(p1.y - p2.y) < 120){
    const s = Math.sign(gap || 1);
    p2.x += s * (MIN_GAP - Math.abs(gap)) * 0.55;   // 轻轻让位，允许贴身擦过
    p2.x = Math.max(40, Math.min(WORLD - 40, p2.x));
  }

  const heavyNow = p1.state === 'swing2';
  const chargeBoost = (p1.charged && heavyNow) ? DMG.chargeBonus : 0;
  checkHit(p1, p2, {swing:[.35,.62], swing2:[.30,.66]}, (heavyNow ? DMG.brawlerHeavy : DMG.brawlerSwing) + chargeBoost,
           ()=> inBox(hitBox(p1, heavyNow ? 180 : (p1.y > 10 ? 175 : 150)), p2));
  checkHit(p2, p1, {club:[.35,.62], club2:[.35,.62]}, DMG.gunMelee,
           ()=> inBox(hitBox(p2, 150), p1));

  if (!over && ((p1.hp <= 0 && !(p1.lastStand && p1.lastStandT > 0)) || (p2.hp <= 0 && p2.reviving <= 0))){
    over = true; slowmo = 1.6; hitstop = 0.22; flash = 0.35; shake = 26;   // 定格 + 慢镜
    const p1Win = p2.hp <= 0;
    if (p1Win) score1++; else score2++;
    document.getElementById('score').textContent = `${score1} : ${score2}`;
    const matchOver = score1 >= 2 || score2 >= 2;
    const who = p1Win ? '木易' : '枪手';
    showMsg(matchOver ? `${who} 拿下比赛` : `${who} 胜 · 第 ${roundNo} 局`, matchOver);
  }
}

const ROUND_LINES = [
  ['来吧。', '别磨蹭。'],
  ['这次不躲了。', '换我进攻。'],
  ['最后一局。', '站着别动。'],
];
function roundLine(){
  const m = document.getElementById('msg');
  const pair = ROUND_LINES[Math.min(ROUND_LINES.length-1, roundNo-1)] || ROUND_LINES[0];
  m.textContent = pair[Math.random() < .5 ? 0 : 1];
  m.style.opacity = 1; m.style.fontSize = '34px'; m.style.color = '#5a5650';
  setTimeout(()=>{ m.style.opacity = 0; m.style.fontSize = '64px'; m.style.color = '#2b2926'; }, 1100);
}

function showMsg(text, matchOver){
  const m = document.getElementById('msg');
  m.textContent = text; m.style.opacity = 1;
  setTimeout(()=>{ m.style.opacity = 0; }, 1600);
  setTimeout(()=>{
    if (matchOver){ score1 = 0; score2 = 0; roundNo = 1; }
    else roundNo++;
    document.getElementById('score').textContent = `${score1} : ${score2}`;
    resetRound();                       // 一回合结束：全部数据归零
    setTimeout(roundLine, 260);
  }, 2400);
}

// ── 绘制 ──
function resetFighter(f){
  f.hp = f.maxHp; f.state = 'idle'; f.t = 0; f.frame = 0;
  f.y = 0; f.vy = 0; f.jumps = 0; f.stun = 0; f.invuln = 0; f.hurtT = 0;
  f.hitDone = false; f.bulletDone = false; f.reloading = 0; f.closeT = 0;
  f.slideT = 0; f.slideVx = 0; f.knockT = 0; f.leapT = 0; f.leapShot = false;
  f.shield = 0; f.shieldMax = 0; f.shieldGuardUsable = true; f.dmgMult = 1;
  // 技能相关
  f.frenzy = false; f.frenzyCd = 0; f.frenzyLeft = 0; f.frenzyT = 0; f.frenzyGlow = false;
  f.frenzyCount = 0; f.frenzyStacks = 0; f.chargeDmg = 0; f.chargeAt = 0; f.chargeWarn = 0;
  f.pierceShot = false; f.pierceVolley = 0; f.pierceNext = 0; f.pierceDmg = 0;
  f.chargeReady = false; f.leapShoot = true; f.leapDist = 0; f.leapMoved = 0;
  f.reviving = 0; f.immortalCd = 0; f.reviveFull = false;
  f.takenTotal = 0; f.storedDmg = 0; f.counterCd = 0; f.wetShot = false;
}
function resetRound(){
  over = false; slowmo = 0; hitstop = 0; shake = 0; flash = 0;
  p1.x = START_X - 210; p2.x = START_X + 210;
  resetFighter(p1); resetFighter(p2);
  p1.face = 1; p2.face = -1;
  fireCd = attackCd = parryCd = 0; dodgeCd = 0; blockCd = 0; closeT = 0;
  parryReq = jumpReq = false; combo = 0; comboT = 0;
  bullets.length = 0; sparks.length = 0; dusts.length = 0; floats.length = 0;
  PROPS.forEach((pr,i)=>{ pr.alive = true; pr.x = 600 + i*(WORLD-1200)/40;
    pr.y = 0; pr.vx = pr.vy = 0; pr.rot = 0; pr.life = 0; pr.hitCd = 0; });
}

function drawFighter(f){
  const fr = getFrame(f.act, f.frame);
  if (!fr) return;
  const s = f.scale, native = (f === p2) ? -1 : 1;
  ctx.save();
  ctx.translate(f.x - cam, GROUND - 640*s - (f.y||0));
  if (f.face !== native) ctx.scale(-1, 1);
  ctx.drawImage(fr.img, fr.sx, fr.sy, fr.sw, fr.sh, -640*s, 0, 1280*s, 720*s);
  ctx.restore();

  if (f === p1 && (p1.chargeT || 0) > 0.1){
    const k = Math.min(1, p1.chargeT / 0.6);
    ctx.save();
    ctx.strokeStyle = `rgba(240,${180 - k*80},60,${0.35 + k*0.5})`;
    ctx.lineWidth = 3 + k * 3;
    ctx.beginPath();
    ctx.arc(f.x - cam, GROUND - BODY_H * 0.55 - (f.y||0) + camY, 46 + k * 26, 0, 7);
    ctx.stroke();
    ctx.restore();
  }
  if (f === p1 && f.lastStand && f.lastStandT > 0){   // 最后的反击：橙色光环 + 火星 + 倒计时
    const cx = f.x - cam, cy = GROUND - CHEST - (f.y||0) + camY;
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 180);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, cy + 40, 10, cx, cy + 40, 150);
    g.addColorStop(0, `rgba(255,120,30,${0.35 * pulse})`);
    g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy + 40, 150, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    for (let i = 0; i < 5; i++){
      const t = ((performance.now() / 900) + i / 5) % 1;
      const px = cx + Math.sin(t * 9 + i) * 46, py = cy + 90 - t * 210;
      ctx.fillStyle = `rgba(255,150,40,${0.85 * (1 - t)})`;
      ctx.beginPath(); ctx.arc(px, py, 2.6 * (1 - t * 0.6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,170,60,.95)'; ctx.font = 'bold 15px Menlo'; ctx.textAlign = 'center';
    ctx.fillText('不倒 ' + Math.ceil(f.lastStandT) + 's', cx, cy - 118);
  }
  if (f === p1 && f.forcePhase === 1){          // 全力预警：扩散紫环 + 倒计时
    const cx = f.x - cam, cy = GROUND - CHEST - (f.y||0) + camY;
    for (let i = 0; i < 2; i++){
      const t = (performance.now() / 900 + i / 2) % 1;
      const r = 30 + 190 * t;
      ctx.strokeStyle = `rgba(160,80,255,${0.6 * (1 - t)})`;
      ctx.lineWidth = 2 + 4 * (1 - t);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(200,140,255,.95)'; ctx.font = 'bold 15px Menlo'; ctx.textAlign = 'center';
    ctx.fillText('全力预警 ' + f.forceT.toFixed(1) + 's', cx, cy - 120);
  }
  if (f === p1 && f.forcePhase === 2){          // 吸附中：漩涡
    const cx = f.x - cam, cy = GROUND - CHEST - (f.y||0) + camY;
    for (let i = 0; i < 3; i++){
      const t = (performance.now() / 500 + i / 3) % 1;
      const r = 50 + 140 * t;
      ctx.strokeStyle = `rgba(160,80,255,${0.5 * (1 - t)})`;
      ctx.lineWidth = 3 + 3 * (1 - t);
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 2; a += 0.3){
        const rr = r * (0.75 + 0.25 * Math.sin(a * 3 + t * 6));
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.72;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
  if (f === p1 && f.pullT > 0){                 // 全力：漩涡吸附特效
    const cx = f.x - cam, cy = GROUND - CHEST - (f.y||0) + camY;
    for (let i = 0; i < 3; i++){
      const t = (performance.now() / 700 + i / 3) % 1;
      const r = 40 + 150 * t;
      ctx.strokeStyle = `rgba(160,80,255,${0.55 * (1 - t)})`;
      ctx.lineWidth = 3 + 3 * (1 - t);
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 2; a += 0.3){
        const rr = r * (0.75 + 0.25 * Math.sin(a * 3 + t * 6));
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.72;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
  if (f === p2 && f.chargeWarn > 0){
    const cx = f.x - cam, cy = GROUND - BODY_H - 26 - (f.y||0) + camY;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px Menlo';
    ctx.fillStyle = 'rgba(255,60,40,.95)';
    ctx.fillText('蓄能弹 ' + f.chargeWarn.toFixed(1) + 's', cx, cy);
    ctx.strokeStyle = 'rgba(255,60,40,.75)'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy + 18, 14, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * (1 - f.chargeWarn / 1.0));
    ctx.stroke();
    ctx.restore();
  }
  if (f === p2 && f.reviving > 0){
    const k = 1 - f.reviving / SK.reviveTime;                  // 0 → 1
    const cx = f.x - cam, cy = GROUND - (f.y||0);
    // 光柱
    const beam = ctx.createLinearGradient(cx, cy - 460, cx, cy);
    beam.addColorStop(0, 'rgba(178,60,255,0)');
    beam.addColorStop(0.5, `rgba(200,110,255,${0.20 + 0.25*k})`);
    beam.addColorStop(1, `rgba(230,190,255,${0.45 + 0.3*k})`);
    ctx.fillStyle = beam;
    const w = 40 + 60 * k;
    ctx.fillRect(cx - w/2, cy - 460, w, 460);
    // 扩散环
    for (let i = 0; i < 3; i++){
      const p = (k + i / 3) % 1;
      ctx.strokeStyle = `rgba(190,120,255,${0.55 * (1 - p)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cx, cy - 10, 30 + 120 * p, (30 + 120 * p) * 0.28, 0, 0, 7); ctx.stroke();
    }
    // 倒计时
    ctx.save();
    ctx.fillStyle = 'rgba(230,200,255,.95)'; ctx.font = 'bold 30px Menlo'; ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(f.reviving) + 's', cx, cy - 300);
    ctx.restore();
  }
  if (f === p2 && (f.frenzyT > 0 || (f.frenzy && f.frenzyGlow))){
    const k = f.frenzyT > 0 ? Math.min(1, f.frenzyT / 1.4) : 0.28;   // 触发时强闪，之后常亮弱光
    const hx = f.x - cam, hy = GROUND - BODY_H * 0.92 - (f.y||0) + camY;
    const r = 120 + 200 * (1 - k);
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, r);
    g.addColorStop(0, `rgba(255,60,40,${0.55 * k})`);
    g.addColorStop(0.45, `rgba(255,40,30,${0.28 * k})`);
    g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(hx, hy, r, 0, 7); ctx.fill();
  }
  if (f.hurtT > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(0.5, f.hurtT * 4);
    ctx.fillStyle = '#e0402a';
    ctx.fillRect(f.x - cam - 25, GROUND - BODY_H - (f.y||0) + camY, 50, BODY_H);   // 只盖身体
    ctx.restore();
  }
}

function drawWorld(){
  const g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#fbfaf6'); g.addColorStop(1,'#efede6');
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);
  // 地面
  ctx.strokeStyle = 'rgba(150,145,140,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(CW,GROUND); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,145,140,.22)'; ctx.lineWidth = 2;
  const k0 = Math.floor(cam/160)*160;
  for (let x = k0; x < cam + CW + 160; x += 160){
    const sx = x - cam;
    ctx.beginPath(); ctx.moveTo(sx, GROUND); ctx.lineTo(sx+46, GROUND+12); ctx.stroke();
  }
  // 平台
  for (const pf of PLATFORMS){
    const sx = pf.x - cam, sy = GROUND - pf.y;
    if (sx > CW || sx + pf.w < 0) continue;
    ctx.fillStyle = '#d9d4c8'; ctx.fillRect(sx, sy, pf.w, pf.h);
    ctx.fillStyle = '#c6c0b3'; ctx.fillRect(sx, sy + pf.h - 6, pf.w, 6);
    ctx.strokeStyle = 'rgba(120,115,108,.5)'; ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, pf.w, pf.h);
  }
  // 小物件
  for (const pr of PROPS){
    if (!pr.alive) continue;
    const sx = pr.x - cam, sy = GROUND - pr.y;
    if (sx < -40 || sx > CW + 40) continue;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(pr.rot);
    if (pr.kind === 0){ ctx.fillStyle='#c98b5a'; ctx.fillRect(-pr.sz/2, -pr.sz, pr.sz, pr.sz); }
    else if (pr.kind === 1){ ctx.fillStyle='#9bb08f'; ctx.beginPath(); ctx.arc(0,-pr.sz/2,pr.sz/2,0,7); ctx.fill(); }
    else { ctx.fillStyle='#a9a29a'; ctx.fillRect(-pr.sz/2, -pr.sz*0.8, pr.sz*0.6, pr.sz*0.8);
           ctx.fillRect(pr.sz*0.1, -pr.sz*0.8, pr.sz*0.5, pr.sz*0.8); }
    ctx.restore();
  }
}

function updateDust(dt){
  for (let i = dusts.length - 1; i >= 0; i--){
    const d = dusts[i]; d.t += dt;
    if (d.t > 0.5){ dusts.splice(i,1); continue; }
    d.x += d.vx * dt; d.y += d.vy * dt; d.vy -= 160 * dt;
  }
}
function updateFloats(dt){
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i]; f.t += dt; f.y -= 34 * dt;
    if (f.t > 1.0) floats.splice(i, 1);
  }
}
function drawFloats(){
  ctx.save();
  ctx.font = 'bold 22px Menlo'; ctx.textAlign = 'center';
  for (const f of floats){
    const k = 1 - f.t;
    ctx.globalAlpha = Math.max(0, k);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x - cam, f.y + camY);
  }
  ctx.restore();
}

function drawDust(){
  for (const d of dusts){
    const k = 1 - d.t / 0.5, r = 6 + 16 * d.t;
    ctx.fillStyle = `rgba(200,194,184,${0.55*k})`;
    ctx.beginPath(); ctx.ellipse(d.x - cam, GROUND - d.y - 4, r, r*0.55, 0, 0, 7); ctx.fill();
  }
}

function drawBullets(){
  for (const b of bullets){
    const x = b.x - cam, y = b.y, mine = b.owner === 'player';
    const vx = (b.vx !== undefined ? b.vx : b.dir * 640);
    const vy = (b.vy || 0);
    const sp = Math.hypot(vx, vy) || 1;
    const ux = vx / sp, uy = vy / sp;
    const tail = Math.min(150, 40 + sp * 0.10);     // 速度越快尾巴越长
    ctx.strokeStyle = b.pierce ? 'rgba(255,60,40,.95)' : (mine ? 'rgba(140,220,255,.9)' : 'rgba(255,214,90,.85)');
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(x - ux*tail, y - uy*tail); ctx.lineTo(x, y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,245,1)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - ux*tail*0.45, y - uy*tail*0.45); ctx.lineTo(x, y); ctx.stroke();
    const g = ctx.createRadialGradient(x, y, 0, x, y, 26);
    if (b.pierce){ g.addColorStop(0,'rgba(255,220,210,.98)'); g.addColorStop(.45,'rgba(255,60,40,.75)'); g.addColorStop(1,'rgba(200,0,0,0)'); }
    else if (mine){ g.addColorStop(0,'rgba(230,250,255,.95)'); g.addColorStop(.45,'rgba(120,210,255,.6)'); g.addColorStop(1,'rgba(80,180,255,0)'); }
    else { g.addColorStop(0,'rgba(255,240,190,.95)'); g.addColorStop(.45,'rgba(255,205,90,.55)'); g.addColorStop(1,'rgba(255,190,60,0)'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();
    ctx.fillStyle = '#fffdf2'; ctx.beginPath(); ctx.ellipse(x, y, 7, 4.5, 0, 0, 7); ctx.fill();
  }
}

function drawFX(dt){
  for (let i = sparks.length-1; i >= 0; i--){
    const s = sparks[i]; s.t += dt;
    if (s.t > .35){ sparks.splice(i,1); continue; }
    const k = 1 - s.t/.35, x = s.x - cam, y = s.y;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = `rgba(255,214,120,${.9*k})`;
    ctx.beginPath();
    for (let j = 0; j < 18; j++){
      const a = Math.PI*j/9, r = (j%2?14:38)*(0.6+k);
      ctx[j?'lineTo':'moveTo'](Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(255,250,230,${k})`;
    ctx.beginPath(); ctx.arc(0,0,10*(0.5+k),0,7); ctx.fill();
    ctx.restore();
  }
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash*0.28})`; ctx.fillRect(0,0,CW,CH); flash = Math.max(0, flash - dt*7); }
}


function selfTestStep(){
  const st = window.__st, k = ++st.ticks;
  st.maxY = Math.max(st.maxY, p1.y || 0);
  if (k === 40){ p1.x = p2.x + 90; p1.state = 'parry'; p1.t = 0.25;
    bullets.length = 0;
    const bb = {x: p1.x, y: GROUND - 258, dir: -1, speed: 0, alive: true, t: 0, owner: 'gun'};
    bullets.push(bb);
    try { tryDeflect(); st.deflected = (bb.owner === 'player') ? 1 : 0; } catch(e){ st.dInfo = 'ERR ' + e.message; }
  }
  if (k === 60){ keys['d'] = true; p1.face = 1; }
  if (k === 90){ keys['d'] = false; }
  if (k >= 100 && k < 130){ p1.x = p2.x + 150; p1.state = 'swing'; p1.t = 0.12; }
  if (p2.state === 'dodge') st.dodgeSeen = 1;
  if (k === 140){
    document.title = `SELFTEST jump=${st.maxY.toFixed(0)} deflect=${st.deflected} steps=${stepCount} aiDodge=${st.dodgeSeen} audio=${audioPlays} | ${st.dInfo}`;
  }
}

let last = performance.now(), fpsAvg = 60;
function loop(now){
  try {
  let dt = Math.min(.05, (now-last)/1000); last = now;
  if (slowmo > 0){ slowmo -= dt; dt *= 0.35; }   // KO 慢镜头
  fpsAvg = fpsAvg*0.92 + (1/Math.max(dt,.001))*0.08;
  step(dt);

  // ── 镜头：主角永远在画面正中（只有到地图边界才让出去）──
  const focus = camLock ? (playerSide === 'gunner' ? p2.x : p1.x) : (p1.x + p2.x) / 2;
  const targetCam = Math.max(0, Math.min(WORLD - CW, focus - CW / 2));
  cam += (targetCam - cam) * Math.min(1, dt * 12);   // 跟得紧，几乎贴着中心
  // 高度：只看自己；死区 70px，落地后慢慢回
  const tall = playerSide === 'gunner' ? Math.max(p2.y || 0, (p1.y || 0) * 0.62)
                                       : Math.max(p1.y || 0, (p2.y || 0) * 0.62);
  const targetY = Math.max(0, (tall - 70) * 0.55);
  camY += (targetY - camY) * Math.min(1, dt * (targetY > camY ? 6 : 3));

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,CW,CH);
  ctx.save();
  const distToFoe = Math.abs(p2.x - p1.x);
  const zoomTarget = Math.max(0.62, Math.min(1, 1050 / (distToFoe + 420)));
  zoom += (zoomTarget - zoom) * Math.min(1, dt * 3);
  ctx.translate(0, camY);
  ctx.translate(CW / 2, CH / 2);
  ctx.scale(zoom, zoom);
  ctx.translate(-CW / 2, -CH / 2);
  if (shake > 0){
    ctx.translate((Math.random()*2-1)*shake, (Math.random()*2-1)*shake*0.6);
    shake = Math.max(0, shake - dt*90);
  }
  drawWorld();
  for (const pr of PROPS){}
  drawFighter(p1); drawFighter(p2);
  drawBullets(); drawFX(dt); drawDust(); drawFloats();
  ctx.restore();

  // 枪手跑出画面 → 边缘箭头提示
  if (!over){
    const sx = p2.x - cam;
    if (sx < 40 || sx > CW - 40){
      const left = sx < 40;
      const ay = GROUND - 200 - (p2.y || 0) + camY;
      ctx.save();
      ctx.fillStyle = 'rgba(200,60,50,.9)';
      ctx.beginPath();
      const ax = left ? 22 : CW - 22, d = left ? -1 : 1;
      ctx.moveTo(ax, ay); ctx.lineTo(ax + d * 18, ay - 12); ctx.lineTo(ax + d * 18, ay + 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(200,60,50,.85)'; ctx.font = '12px Menlo';
      ctx.textAlign = left ? 'left' : 'right';
      ctx.fillText(Math.round(Math.abs(p2.x - p1.x)) + 'px', left ? 46 : CW - 46, ay + 4);
      ctx.restore();
    }
  }
  if (AUTO.length){
    ctx.fillStyle = 'rgba(200,60,40,.9)'; ctx.font = 'bold 20px Menlo';
    ctx.fillText('自动演示中（URL 带 ?auto=）', 20, 36);
  }
  if (showCheck){
    const rows = [
      `贴图 ${ACT.length} 个动作 / ${Object.keys(imgCache).length} 张`,
      `子弹 ${bullets.length} · 火星 ${sparks.length} · 尘埃 ${dusts.length}`,
      `道具存活 ${PROPS.filter(x=>x.alive).length} / ${PROPS.length}`,
      `音频 ${AC ? (AC.state || 'on') : '未启动（点一下页面）'} · 播放 ${audioPlays}`,
      `帧率 ${fpsAvg.toFixed(0)} · 镜头 ${cam.toFixed(0)} · 比分 ${score1}:${score2}`,
      `p1 ${p1.state} hp${p1.hp.toFixed(0)} y${p1.y.toFixed(0)} · p2 ${p2.state} hp${p2.hp.toFixed(0)}`,
    ];
    ctx.save();
    ctx.fillStyle = 'rgba(20,20,24,.82)';
    ctx.fillRect(16, 80, 470, 20 * rows.length + 20);
    ctx.fillStyle = '#f2efe8'; ctx.font = '14px Menlo';
    rows.forEach((r,i)=> ctx.fillText(r, 30, 104 + i*20));
    ctx.restore();
  }
  if (debugOn){
    for (const [a, reach] of [[p1, 170], [p2, 180]]){
      const bb = hitBox(a, reach);
      ctx.strokeStyle = 'rgba(220,60,60,.75)'; ctx.lineWidth = 2;
      ctx.strokeRect(bb.x - cam, bb.y + camY, bb.w, bb.h);   // 补上镜头的纵向偏移
    }
    for (const f of [p1, p2]){
      ctx.strokeStyle = 'rgba(60,120,220,.75)';
      const bx = f.x - cam, by = GROUND - 250 - (f.y||0) + camY;
      const hbx = hurtBox(f);
      ctx.strokeRect(hbx.x - cam, hbx.y + camY, hbx.w, hbx.h);   // 受击框（滑铲时会变扁）
    }
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.font = '15px Menlo';
    ctx.fillText(`p1 ${p1.state} hp=${p1.hp.toFixed(0)} y=${p1.y.toFixed(0)} jumps=${p1.jumps} x=${p1.x.toFixed(0)}`, 20, 600);
    ctx.fillText(`p2 ${p2.state} hp=${p2.hp.toFixed(0)} y=${p2.y.toFixed(0)} x=${p2.x.toFixed(0)} cd=${fireCd.toFixed(2)} d=${Math.abs(p1.x-p2.x).toFixed(0)}`, 20, 622);
    ctx.fillText(`cam=${cam.toFixed(0)} 世界宽=${WORLD} 子弹=${bullets.length} 道具=${PROPS.filter(x=>x.alive).length} fps=${fpsAvg.toFixed(0)}`, 20, 644);
  }
  if (musicGain && AC){
    const tension = 1 - Math.min(p1.hp, p2.hp) / 100;
    musicGain.gain.value = 0.10 + tension * 0.06;
  }
  ctx.save();
  ctx.font = '13px Menlo'; ctx.textAlign = 'left';
  const cd1 = p2.immortalCd > 0 ? Math.ceil(p2.immortalCd) + 's' : '就绪';
  const cd2 = p2.frenzy ? '狂化中 ' + Math.ceil(p2.frenzyLeft) + 's'
            : (p2.frenzyCd > 0 ? Math.ceil(p2.frenzyCd) + 's' : '就绪');
  ctx.fillStyle = 'rgba(60,50,80,.75)';
  ctx.fillText(`枪手  不朽 ${cd1} · 狂化 ${cd2} · 盾 ${Math.round(p2.shield || 0)}`, 20, CH - 58);
  const cd3 = p1.counterCd > 0 ? Math.ceil(p1.counterCd) + 's' : (p1.takenTotal > 0 ? '就绪·下一击引爆' : '就绪');
  ctx.fillStyle = 'rgba(50,60,80,.75)';
  ctx.fillText(`木易  还击 ${cd3} · 反击池 ${Math.round(p1.takenTotal)}/${counterCap()}`, 20, CH - 38);
  ctx.restore();
  if (combo >= 3){
    ctx.save();
    ctx.fillStyle = 'rgba(220,80,40,.92)';
    ctx.font = 'bold 34px Menlo';
    ctx.textAlign = 'center';
    ctx.fillText(combo + ' HIT', CW/2, 120);
    ctx.restore();
  }
  if (PROBE && !window.__probe){ window.__probe = 1; document.title = 'PROBE ok frames'; }
  updateCools();
  document.getElementById('hp1').style.width = Math.max(0, p1.hp / p1.maxHp * 100) + '%';
  document.getElementById('hp2').style.width = Math.max(0, p2.hp / p2.maxHp * 100) + '%';
  } catch (e) {
    ctx.fillStyle = '#b00'; ctx.font = '14px Menlo';
    ctx.fillText('JS: ' + e.message, 20, 70);
  }
  requestAnimationFrame(loop);
}

function applyDifficulty(key){
  const d = DIFFS[key] || DIFFS.divine;
  CFG = d;
  MAX_HP = d.hp;
  DMG.brawlerSwing = d.swing; DMG.brawlerHeavy = d.heavy;
  DMG.gunRanged = d.ranged;  DMG.gunMelee = d.melee;
  SK.frenzyCd = d.frenzyCd;
  if (playerSide === 'gunner'){                       // 玩家操控枪手：自身数值走一丝神力
    const d2 = DIFFS.divine;
    MAX_HP = Math.max(MAX_HP, d2.hp);
    CFG = Object.assign({}, d, { reload: d2.reload, alwaysCharged: false, chargeSpeedX: d2.chargeSpeedX });
  }
  p1.maxHp = p2.maxHp = MAX_HP;
  p1.hp = p2.hp = MAX_HP;
  resetRound();
  buildCools();
  gameStarted = true;
  const st = document.getElementById('start');
  if (st) st.style.display = 'none';
  document.title = '枪手 vs 木易 · ' + d.label;
}

function updateTip(){
  const pad = document.getElementById('touch');
  if (pad) pad.querySelectorAll('.gunonly').forEach(b=>{ b.style.display = playerSide === 'gunner' ? '' : 'none'; });
  const tip = document.getElementById('tip');
  if (!tip) return;
  tip.textContent = playerSide === 'gunner'
    ? 'A/D 移动 · W 跳 · J 开火（蓄能就绪时发射）· U 枪托 · K 滑铲 · K+W 大后跳 · L 格挡 · E 狂化 · F1 调试'
    : 'A/D 移动 · Shift 跑 · W 跳（可二段）· J 挥击（Shift+J 重击）· K 闪避 · L 拨挡 · R 全力（池>500）· F1 调试';
}

function setupStart(){
  const st = document.getElementById('start');
  if (!st) return;
  const roleBtn = document.getElementById('roleBtn');
  if (roleBtn){
    roleBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      playerSide = (playerSide === 'brawler') ? 'gunner' : 'brawler';
      updateTip();
      roleBtn.innerHTML = playerSide === 'gunner'
        ? '<b>扮演：枪手</b><span>点一下切换成「扮演木易」</span>'
        : '<b>扮演：木易</b><span>点一下切换成「扮演枪手」</span>';
    });
  }
  st.querySelectorAll('button[data-d]').forEach(b=>{
    b.addEventListener('click', ()=>{ audioInit(); startExternalBgm(); applyDifficulty(b.dataset.d); });
  });
  if (new URLSearchParams(location.search).get('role') === 'gunner') playerSide = 'gunner';
  const q = new URLSearchParams(location.search).get('difficulty');
  updateTip();
  if (q && DIFFS[q]) applyDifficulty(q);
}

          keyReq.r = true; step(0.02);
          ok('brawlerForce', p1.forcePhase === 2 && p1.forceCd > 0,
             `ph${p1.forcePhase || 0},cd${(p1.forceCd||0).toFixed(0)}`);
          p1.forcePhase = 0; p1.forceCd = 0;
        }

        // 10 枪手模式开火
        if (playerSide === 'gunner'){
          resetRound(); over = false; fireCd = 0; p2.reloading = 0; bullets.length = 0;
          p2.state = 'idle'; p2.leapT = 0; p2.slideT = 0; p2.stun = 0;
          const shots0 = window.__shotCount || 0;
        const hits0 = window.__bulletHits || 0;
          keys['j'] = true; sim(25); keys['j'] = false;
          ok('gunfire', (window.__shotCount || 0) > shots0, 'shots' + ((window.__shotCount||0) - shots0) + ',st' + p2.state);
        }
      } catch(e){ R.push('EXC ' + e.message); }
      const line = 'FAST ' + (playerSide) + ' | ' + R.join(' | ');
      document.title = line;
      try { fetch('http://127.0.0.1:8791/report', {method:'POST', body: line}); } catch(e){}
    }, 1200);
  }
  if (new URLSearchParams(location.search).get('test') === 'gunskills'){
    setTimeout(()=>{
      const out = [];
      try {
        p2.x = p1.x + 400; p2.state = 'idle'; p2.slideT = 0; p2.leapT = 0; p2.frenzyCd = 0; p2.reloading = 0;
        const x0 = p2.x;
        keys['k'] = true; for (let i = 0; i < 30; i++) step(0.02); keys['k'] = false;
        out.push('滑铲位移=' + Math.round(Math.abs(p2.x - x0)) + ' 状态=' + p2.state);
        p2.state = 'idle'; p2.slideT = 0; p2.stun = 0; p2.reloading = 0; fireCd = 0; parryReq = true; blockCd = 0;
        for (let i = 0; i < 3; i++) step(0.02);
        out.push('格挡状态=' + p2.state + ' 有效时长=' + (p2.blockT || 0).toFixed(2) + 's');
        p2.state = 'idle'; p2.stun = 0; p2.leapT = 0; const x1 = p2.x; keyReq.q = true;
        for (let i = 0; i < 10; i++) step(0.02);
        out.push('后跳=' + Math.round(Math.abs(p2.x - x1)) + 'px');
        keyReq.e = true; p2.frenzy = false; p2.frenzyCd = 0;
        for (let i = 0; i < 3; i++) step(0.02);
        out.push('狂化=' + (p2.frenzy ? 1 : 0) + ' 蓄能=' + (p2.chargeAt || 0).toFixed(1) + 's');
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'GUNSKILLS ' + out.join(' | ');
    }, 900);
  }
  if (new URLSearchParams(location.search).get('test') === 'gunrole'){
    setTimeout(()=>{
      const out = ['扮演=' + playerSide];
      try {
        p2.x = p1.x + 400; p2.face = -1; fireCd = 0; p2.reloading = 0; p2.state = 'idle';
        keys['d'] = true; const gx = p2.x;
        for (let i = 0; i < 20; i++) step(0.02);
        keys['d'] = false;
        out.push('按D移动=' + Math.round(p2.x - gx) + 'px');
        bullets.length = 0; keys['j'] = true;
        for (let i = 0; i < 6; i++) step(0.02);
        keys['j'] = false;
        out.push('按J开火 状态=' + p2.state + ' 子弹=' + bullets.length);
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'GUNROLE ' + out.join(' | ');
    }, 900);
  }
  if (new URLSearchParams(location.search).get('test') === 'props'){
    setTimeout(()=>{
      const out = [];
      out.push('物件数=' + PROPS.length);
      try {
        const pr = PROPS[10];
        pr.alive = true; pr.x = 8300; pr.y = 0; pr.vx = 0; pr.vy = 0;
        p1.x = 8200; p1.face = 1; p1.state = 'swing2'; p1.t = 0.35;
        hitProps(p1);
        const launched = pr.projectile === true;
        for (let i = 0; i < 300; i++) updateProps(0.02);
        out.push('被打飞=' + (launched ? 1 : 0) + ' 300帧后仍存在=' + (pr.alive ? 1 : 0) + ' x=' + Math.round(pr.x));
        const before = PROPS.filter(q => q.alive).length;
        for (let i = 0; i < 600; i++) updateProps(0.02);
        const after = PROPS.filter(q => q.alive).length;
        out.push('再跑12秒: ' + before + '→' + after);
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'PROPS ' + out.join(' | ');
    }, 800);
  }
  if (new URLSearchParams(location.search).get('test') === 'ai'){
    setTimeout(()=>{
      const out = [];
      try {
        resetRound(); over = false; gameStarted = true;
        const hp0 = p1.hp + p2.hp;
        const shots0 = window.__shotCount || 0;
        const hits0 = window.__bulletHits || 0;
        let swings = 0, shots = 0, leaps = 0;
        for (let i = 0; i < 900; i++){               // 18 秒
          hitstop = 0; step(0.02);
          if (p1.state === 'swing' || p1.state === 'swing2') swings++;
          if (/^fire/.test(p2.state)) shots++;
          if (p2.state === 'leap') leaps++;
          if (over) break;
        }
        const dealt = hp0 - (p1.hp + p2.hp);
        out.push(`总伤害=${Math.round(dealt)}`);
        out.push(`木易挥击帧=${swings}`);
        out.push(`枪手开火帧=${shots}`);
        out.push(`实际出膛=${(window.__shotCount||0) - shots0}`);
        out.push(`命中=${(window.__bulletHits||0) - hits0}`);
        out.push(`末态 hp: 木易${Math.round(p1.hp)} 枪手${Math.round(p2.hp)} shield${Math.round(p2.shield)}`);
        out.push(`枪手后跳帧=${leaps}`);
        out.push(`结果:${over ? '分出胜负' : '仍在战斗'}`);
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'AI ' + out.join(' | ');
    }, 800);
  }
  if (new URLSearchParams(location.search).get('test') === 'jumpdist'){
    setTimeout(()=>{
      const out = [];
      try {
        const meas = (who)=>{
          resetRound(); over = false;
          const f = who === 'brawler' ? p1 : p2;
          f.x = 8000; f.y = 0; f.vy = 0; f.jumps = 0; f.stun = 0; f.state = 'idle';
          const x0 = f.x;
          if (who === 'brawler'){ keys['d'] = true; jumpReq = true; sim2(70); keys['d'] = false; }
          else { keys['d'] = true; jumpReq = true; sim2(70); keys['d'] = false; }
          return Math.round(f.x - x0);
        };
        const sim2 = (n)=>{ for (let i=0;i<n;i++){ hitstop = 0; p1.stun = 0; p2.stun = 0; step(0.02); } };
        out.push('木易跳远=' + meas('brawler') + 'px');
        out.push('枪手跳远=' + meas('gunner') + 'px');
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'JUMPDIST ' + out.join(' | ');
    }, 800);
  }
  if (new URLSearchParams(location.search).get('test') === 'jump'){
    setTimeout(()=>{
      const out = [];
      const measure = (f)=>{
        resetRound(); over = false; f.y = 0; f.vy = 0; f.jumps = 0; f.stun = 0;
        tryJump(f); let maxY = 0, frames = 0;
        while (f.y > 0 || frames < 2){ step(0.02); frames++; maxY = Math.max(maxY, f.y); if (frames > 400) break; }
        return {maxY, frames};
      };
      try {
        const a = measure(p1), b = measure(p2);
        out.push(`木易 maxY=${a.maxY.toFixed(0)}px 滞空${(a.frames*0.02).toFixed(2)}s`);
        out.push(`枪手 maxY=${b.maxY.toFixed(0)}px 滞空${(b.frames*0.02).toFixed(2)}s`);
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'JUMP ' + out.join(' | ');
    }, 800);
  }
  if (new URLSearchParams(location.search).get('test') === 'role'){
    setTimeout(()=>{
      const out = [];
      out.push('扮演=' + playerSide);
      out.push('打手技能=' + (CFG.brawlerSkills ? 1 : 0));
      try {
        p1.takenTotal = 800; p1.forceCd = 0; p2.x = p1.x + 400;
        p1.pullT = 0.8; p1.set('pull', {force:true}); p1.forceCd = 10;
        const x0 = p2.x;
        for (let i = 0; i < 80 && p1.pullT > 0; i++) step(0.02);
        out.push('拉近=' + Math.round(Math.abs(x0 - p2.x)) + 'px 枪手血' + Math.round(p2.hp));
        out.push('冷却=' + p1.forceCd.toFixed(1) + 's');
        out.push('全力执行次数=' + (window.__pullHit || 0) + ' 伤害=' + (window.__pullDmg || 0) + ' 剩余池=' + Math.round(p1.takenTotal));
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'ROLE ' + out.join(' | ');
    }, 900);
  }
  if (new URLSearchParams(location.search).get('test') === 'bar'){
    setTimeout(()=>{
      const c2 = document.getElementById('cool2');
      const row = c2 && c2.children[2];
      const trk = row && row.querySelector('.trk');
      const lab = row && row.querySelector('.lab');
      p2.chargeAt = 0.8; p2.chargeTotal = 3; updateCools();
      const lab2 = row && row.querySelector('.lab').textContent;
      p2.frenzy = true; p2.chargeAt = 0; updateCools();
      const lab3 = row && row.querySelector('.lab').textContent;
      const cs = lab ? getComputedStyle(lab) : null;
      const rect = lab ? lab.getBoundingClientRect() : null;
      document.title = 'BAR 高=' + (trk ? getComputedStyle(trk).height : '?')
        + ' | 文字:' + (lab ? lab.textContent : '无')
        + ' 色:' + (cs ? cs.color : '?') + ' 底:' + (cs ? cs.backgroundColor : '?')
        + ' 尺寸:' + (rect ? Math.round(rect.width) + 'x' + Math.round(rect.height) : '?')
        + ' 可见:' + (rect ? (rect.height > 0 && rect.width > 0) : '?');
    }, 900);
  }
  if (new URLSearchParams(location.search).get('test') === 'diff'){
    setTimeout(()=>{
      const out = [];
      const q = new URLSearchParams(location.search).get('difficulty') || 'divine';
      out.push('难度=' + CFG.label + ' 血=' + MAX_HP + ' 远程=' + DMG.gunRanged + ' 近战=' + DMG.gunMelee);
      out.push('技能=' + (CFG.skills ? 1 : 0) + ' 狂化CD=' + SK.frenzyCd + ' 装弹=' + CFG.reload + ' 击飞倍率=' + CFG.knockbackX);
      try {
        bullets.length = 0; p2.x = p1.x + 400; p2.face = -1;
        spawnBullet(p2);
        const b = bullets[0];
        out.push('子弹: dmg' + b.dmg + ' 速度' + Math.round(Math.hypot(b.vx, b.vy)) + ' 追踪' + (b.homing || 0) + ' 不可反弹' + (b.noReflect ? 1 : 0));
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'DIFF ' + out.join(' | ');
    }, 1000);
  }
  if (new URLSearchParams(location.search).get('test') === 'hud'){
    setTimeout(()=>{
      const c1 = document.getElementById('cool1'), c2 = document.getElementById('cool2');
      const out = ['左' + (c1 ? c1.children.length : -1) + '条', '右' + (c2 ? c2.children.length : -1) + '条'];
      if (c2 && c2.children[2]){
        p2.frenzy = true; p2.chargeAt = 1.5; p2.chargeTotal = 3; updateCools();
        out.push('蓄能条宽' + c2.children[2].querySelector('i').style.width);
        p2.chargeAt = 0.75; updateCools();
        out.push('半程宽' + c2.children[2].querySelector('i').style.width);
      }
      document.title = 'HUD ' + out.join(' | ');
    }, 900);
  }
  if (new URLSearchParams(location.search).get('test') === 'shield'){
    setTimeout(()=>{
      const out = [];
      try {
        p2.hp = p2.maxHp; p2.shield = 900; p2.shieldMax = 900; p2.invuln = 0;
        const s0 = p2.shield;
        applyDamage(p2, 1000, 1);                    // 单次超过上限
        out.push('盾900挨1000 → 盾剩' + Math.round(p2.shield) + '（应剩600）血' + Math.round(p2.hp));
        p2.shield = 1500; p2.shieldMax = 1500;       // 刷新历史最高
        const s1 = p2.shield;
        applyDamage(p2, 1000, 1);
        out.push('盾1500挨1000 → 盾剩' + Math.round(p2.shield) + '（应剩1000）');
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'SHIELD ' + out.join(' | ');
    }, 700);
  }
  if (new URLSearchParams(location.search).get('test') === 'air'){
    setTimeout(()=>{
      const out = [];
      try {
        p1.x = 9000; p1.y = 200; p1.vy = 0; p1.state = 'jump'; p1.jumps = 1;
        const x0 = p1.x;
        keys['a'] = false; keys['d'] = true;
        for (let i = 0; i < 30; i++) step(0.016);
        out.push('按住右空中位移=' + (p1.x - x0).toFixed(0) + 'px');
        const x1 = p1.x;
        keys['d'] = false; keys['a'] = true;
        for (let i = 0; i < 30; i++) step(0.016);
        out.push('按住左空中位移=' + (p1.x - x1).toFixed(0) + 'px');
        keys['a'] = keys['d'] = false;
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'AIR ' + out.join(' | ');
    }, 800);
  }
  if (new URLSearchParams(location.search).get('test') === 'dmg'){
    setTimeout(()=>{
      const out = [];
      try {
        bullets.length = 0; p2.x = p1.x + 500; p2.face = -1;
        spawnBullet(p2);
        const b = bullets[0];
        out.push('普通弹伤害=' + b.dmg);
        tryDeflectTest();
      } catch(e){ out.push('ERR ' + e.message); }
      function tryDeflectTest(){
        p1.state = 'parry'; p1.t = 0.3; b0 = bullets[0];
        const bb = {x: p1.x + 60, y: b0.y, dir: -1, speed: 0, alive: true, t: 0, owner: 'gun', dmg: b0.dmg, pierce: false};
        bullets.length = 0; bullets.push(bb);
        tryDeflect();
        out.push('反弹后伤害=' + (bb.owner === 'player' ? bb.dmg : '未反弹') + '/归属' + bb.owner);
        out.push('近战=' + DMG.gunMelee + ' 远程=' + DMG.gunRanged);
        document.title = 'DMG ' + out.join(' | ');
      }
    }, 600);
  }
  if (new URLSearchParams(location.search).get('test') === 'prop'){
    setTimeout(()=>{
      const out = [];
      try {
        PROPS.forEach(pr => { pr.alive = false; pr.projectile = false; });
        const pr = PROPS[0];
        p2.x = 8600; p2.y = 0; p2.hp = p2.maxHp; p2.shield = 0; p2.invuln = 0; p2.testFreeze = true;
        pr.alive = true; pr.x = 8000; pr.y = 0; pr.vx = 0; pr.vy = 0; pr.projectile = false;
        hitProps({ state: 'swing2', act: 'bat_swing_v', t: 0.35, x: 8000, y: 0, face: 1 });
        out.push('变成弹道=' + (pr.projectile ? 1 : 0));
        for (let i = 0; i < 60 && pr.alive; i++) updateProps(0.02);
        out.push('命中后枪手血=' + Math.round(p2.hp) + '/弹道存活=' + (pr.alive ? 1 : 0));
      } catch(e){ out.push('ERR ' + e.message); }
      document.title = 'PROP ' + out.join(' | ');
    }, 600);
  }
  if (new URLSearchParams(location.search).get('test') === 'stick'){
    setTimeout(()=>{
      const st = document.getElementById('stick');
      const fire = (type, dx, dy)=>{
        const r = st.getBoundingClientRect();
        st.dispatchEvent(new PointerEvent(type, {
          clientX: r.left + r.width/2 + dx, clientY: r.top + r.height/2 + dy,
          pointerId: 1, bubbles: true, buttons: 1, pointerType: 'touch'
        }));
      };
      const out = [];
      p1.state = 'idle'; p1.slideT = 0; jumpReq = false; keys['a'] = keys['d'] = false;
      fire('pointerdown', 0, -60);
      out.push('上→' + (jumpReq ? '跳' : '无') + '/a' + (keys['a']?1:0) + 'd' + (keys['d']?1:0));
      jumpReq = false;
      fire('pointermove', -50, -30);
      out.push('左上→跳' + (jumpReq ? 1 : 0) + '/a' + (keys['a']?1:0));
      jumpReq = false;
      fire('pointermove', 55, 0);
      out.push('右→a' + (keys['a']?1:0) + 'd' + (keys['d']?1:0) + '跑' + (keys['shift']?1:0));
      fire('pointermove', 45, 55);
      out.push('右下→滑' + (p1.state === 'dodge' ? 1 : 0) + '脸' + p1.face);
      fire('pointerup', 45, 55);
      out.push('松手→a' + (keys['a']?1:0) + 'd' + (keys['d']?1:0));
      document.title = 'STICK ' + out.join(' | ');
    }, 800);
  }
  if (new URLSearchParams(location.search).get('test') === 'push'){
    p1.x = p2.x - 200; keys['d'] = true;          // 不冻结，测真实推挤
    let x0 = p1.x, minGap = 9999, last = p1.x, stuck = 0;
    setInterval(()=>{
      const g = Math.abs(p2.x - p1.x);
      minGap = Math.min(minGap, g);
      if (Math.abs(p1.x - last) < 0.5) stuck++; else stuck = 0;
      last = p1.x;
      document.title = `PUSHTEST moved=${(p1.x-x0).toFixed(0)} gap=${g.toFixed(0)} minGap=${minGap.toFixed(0)} stuck=${stuck} p1state=${p1.state} p2=${p2.state}`;
    }, 250);
  }
  if (new URLSearchParams(location.search).get('test') === 'all')
    regress().catch(e => { document.title = 'REGRESS-ERR ' + e.message; });
  if (DIAG) setTimeout(()=>{
    const d = window.__diag;
    document.title = `DIAG atlas=${!!window.__ATLAS} caches=${Object.keys(imgCache).length} calls=${d.calls} nulls=${d.nulls} ok=${d.atlases}`;
  }, 5000);
  requestAnimationFrame(loop);
});
</script>
</body>
